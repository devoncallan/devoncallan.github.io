<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Nothing at this address</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#f7f6f3; --ink:#1e2126; --soft:#5a616b; --faint:#8b9096;
  --rule:#d8d5cd; --accent:#1d68c4;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); min-height:100vh;
  display:flex; align-items:center; padding-block:48px; padding-left:20px; padding-right:20px;
  font:400 15px/1.55 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.box{max-width:520px; margin:0 auto}
p.code{font:500 11px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace; letter-spacing:.14em;
  text-transform:uppercase; color:var(--faint); margin:0 0 14px}
h1{font-size:27px; font-weight:600; letter-spacing:-.018em; line-height:1.15;
  margin:0 0 12px; text-wrap:balance}
p.say{color:var(--soft); margin:0 0 24px}
a{color:var(--accent); text-decoration:none; font-weight:500;
  border-bottom:1px solid var(--rule); padding-bottom:1px}
a:hover{border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div class="box">
  <p class="code">404</p>
  <h1>Nothing at this address</h1>
  <p class="say">The page may have been renamed, or the link may be older than the current set of explorers.</p>
  <a href="/">See what's here &rarr;</a>
</div>
</body>
</html>
