<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Camera, spectra and color space for one flow-chemistry run: 63 dye mixtures, each with its tube photo, extracted color and UV-vis spectrum.">
<meta name="color-scheme" content="light">
<style>
  html{color-scheme:light}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>Tube Color Explorer</title>
<style>
  :root{
    --ink:#1b1a18; --ink2:#57544e; --muted:#8c8880; --rule:#e4e2dc; --grid:#efeee9;
    --surface:#fff; --bg:#f7f6f3; --ring:#1b1a18; --measured:#1b1a18;
    --A:#e0a112; --B:#cf3557; --C:#2f76cf; --D:#9b978f;
    --chR:#cf3557; --chG:#17a874; --chB:#2f76cf;
  }
  *{box-sizing:border-box}
  body{font:13px system-ui,-apple-system,"Segoe UI",sans-serif; margin:0; color:var(--ink);
       background:var(--bg); height:100dvh; overflow:hidden; padding:10px 12px;
       color-scheme:light}
  .app{height:100%; display:grid; gap:10px;
       grid-template-columns:184px minmax(300px,1.12fr) minmax(330px,1fr);
       grid-template-rows:auto auto minmax(0,1.35fr) minmax(0,0.72fr);
       grid-template-areas:"head head head" "rail tube space" "rail spec space" "rail spec fit"}
  header{grid-area:head; display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:0 2px 2px}
  h1{font-size:14.5px; font-weight:600; margin:0; letter-spacing:-.012em}
  .run{font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--muted); font-size:11.5px}
  .spacer{flex:1}
  .tag{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11.5px; padding:2px 8px;
       border-radius:9px; border:1px solid var(--rule); color:var(--ink2); white-space:nowrap}
  .card{display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--surface);
        border:1px solid var(--rule); border-radius:9px; padding:9px 11px}
  .rail{grid-area:rail} .tube{grid-area:tube} .spec{grid-area:spec}
  .fit{grid-area:fit} .space{grid-area:space}
  .space .fill{align-items:center}
  h2{font-size:10px; font-weight:700; margin:0 0 7px; color:var(--ink2); text-transform:uppercase;
     letter-spacing:.075em; display:flex; gap:7px; align-items:baseline}
  h2 em{font-style:normal; font-weight:400; text-transform:none; letter-spacing:0;
        color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .fill{flex:1; min-height:0; display:flex}
  .chart{width:100%; height:100%; display:block}
  .frame{position:relative; line-height:0; flex:none}
  .frame img{width:100%; display:block; border-radius:5px 5px 0 0; border:1px solid var(--rule);
             border-bottom:none}
  .frame svg{position:absolute; inset:0; width:100%; height:100%}
  .swbar{display:flex; height:30px; border:1px solid var(--rule); border-radius:0 0 5px 5px;
         overflow:hidden; flex:none}
  .swbar div{flex:1; position:relative}
  .swbar span{position:absolute; left:6px; bottom:3px; font:10px/1 ui-monospace,Menlo,monospace;
              color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.65); letter-spacing:.02em}
  .tuberow{display:flex; gap:12px; align-items:flex-start; margin-top:8px; flex:none}
  .facts{display:flex; flex-direction:column; gap:3px}
  .hex{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:19px; line-height:1.05}
  .sub{font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--ink2); font-size:11px;
       font-variant-numeric:tabular-nums}
  .pumps{display:flex; gap:10px; margin-left:auto; font-size:11px; align-self:center}
  .pumps div{text-align:right}
  .pumps b{display:block; font-weight:600; font-size:9.5px; color:var(--muted); letter-spacing:.04em}
  .pumps span{font-family:ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}
  #strip{display:grid; grid-template-columns:repeat(8,1fr); gap:2px; align-content:start;
         overflow:auto; flex:1; min-height:0}
  .chip{aspect-ratio:1; border-radius:2px; border:1px solid var(--rule); padding:0;
        cursor:pointer; position:relative}
  .chip:focus-visible{outline:2px solid var(--ring); outline-offset:1px; z-index:2}
  .chip[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ring); z-index:1}
  .chip::after{content:""; position:absolute; left:2px; right:2px; bottom:-1px; height:2px;
               border-radius:1px; background:var(--mk,transparent)}
  .legend{display:flex; flex-direction:column; gap:3px; margin-top:8px; font-size:10.5px;
          color:var(--muted); flex:none}
  .dot{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px}
  button.nav,button.seg{font:inherit; font-size:11.5px; padding:2px 9px; border-radius:5px;
    cursor:pointer; border:1px solid var(--rule); background:var(--surface); color:var(--ink2)}
  button.nav:hover,button.seg:hover{border-color:var(--ink2); color:var(--ink)}
  button.seg[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  button.nav:focus-visible,button.seg:focus-visible{outline:2px solid var(--ring); outline-offset:2px}
  label.tog{display:flex; gap:4px; align-items:center; cursor:pointer; color:var(--ink2);
            font-size:11.5px}
  input[type=range]{width:118px; accent-color:var(--C); vertical-align:middle}
  .spacetop{display:flex; gap:6px; align-items:center; margin-bottom:6px; flex:none}
  circle.pt{cursor:pointer}
  @media (max-width:1180px){
    body{height:auto; overflow:auto}
    .app{grid-template-columns:184px minmax(0,1fr);
         grid-template-rows:auto auto auto auto auto;
         grid-template-areas:"head head" "rail tube" "rail spec" "rail space" "rail fit"}
    .space .fill{min-height:380px}
    .card{min-height:280px} .rail{min-height:420px}
  }
  @media (max-width:720px){
    .app{grid-template-columns:1fr;
         grid-template-areas:"head" "tube" "spec" "space" "fit" "rail"}
    #strip{grid-template-columns:repeat(16,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tube color explorer</h1>
    <span class="run" id="run"></span>
    <button class="nav" id="prev" type="button">&larr;</button>
    <button class="nav" id="next" type="button">&rarr;</button>
    <span class="tag" id="tag"></span>
    <span class="spacer"></span>
    <label class="tog"><input type="checkbox" id="showmask" checked> mask</label>
    <label class="tog" for="srange">dye fraction</label>
    <input type="range" id="srange" min="2" max="100" step="1" value="50">
    <span class="tag" id="sval">0.50</span>
  </header>

  <div class="card rail">
    <h2>The run <em>63 points</em></h2>
    <div id="strip" role="group" aria-label="run points"></div>
    <div class="legend" id="blocklegend"></div>
  </div>

  <div class="card tube">
    <h2>In the tube <em id="lagnote"></em></h2>
    <div class="frame">
      <img id="frame" alt="camera frame, cropped to the tube">
      <svg id="overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
    <div class="swbar">
      <div id="sw"><span>measured</span></div>
      <div id="swp"><span>predicted</span></div>
    </div>
    <div class="tuberow">
      <div class="facts">
        <div class="hex" id="hex">#000000</div>
        <div class="sub" id="rgbtxt"></div>
        <div class="sub" id="detxt"></div>
      </div>
      <div class="pumps" id="pumps"></div>
    </div>
  </div>

  <div class="card spec">
    <div class="spacetop">
      <h2 style="margin:0">Absorbance <em id="uvnote"></em></h2>
      <span class="spacer"></span>
      <button class="seg" id="uStack" type="button" aria-pressed="true">stacked</button>
      <button class="seg" id="uOver" type="button" aria-pressed="false">overlaid</button>
    </div>
    <div class="fill"><svg id="uv" class="chart" role="img" aria-label="absorbance by dye"></svg></div>
  </div>

  <div class="card fit">
    <h2>Pixels in the mask <em>weighted by how much each pixel varies over the run</em></h2>
    <div class="fill"><svg id="hist" class="chart" role="img" aria-label="RGB distribution"></svg></div>
  </div>

  <div class="card space">
    <div class="spacetop">
      <h2 style="margin:0">Color space</h2>
      <span class="spacer"></span>
      <button class="seg" id="mTern" type="button" aria-pressed="false">dye triangle</button>
      <button class="seg" id="mXy" type="button" aria-pressed="true">CIE xy</button>
      <button class="seg" id="mLab" type="button" aria-pressed="false">Lab a*b*</button>
    </div>
    <div class="fill"><svg id="space" class="chart" role="img" aria-label="color space"></svg></div>
    <div class="sub" id="camnote" style="margin-top:6px; color:var(--muted); font-size:10.5px"></div>
  </div>
</div>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.points, FH = D.crop[1] - D.crop[0], FW = D.width;
const V0 = D.cam.vis[0], V1 = D.cam.vis[1], NV = V1 - V0;
let sel = 0, strength = 0.5, mode = 'xy', uvMode = 'stacked';

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16)
  .padStart(2, '0')).join('');
const MARK = {vertex: '--A', edge: '--B', interior: '--C', reference: '--D'};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);

$('run').textContent = D.run;
$('lagnote').textContent = D.lag_mL + ' mL downstream of the cell, matched by volume';
$('blocklegend').innerHTML = Object.keys(MARK).map(k =>
  '<span><span class="dot" style="background:var(' + MARK[k] + ')"></span>' + k + '</span>').join('');

const strip = $('strip');
P.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.type = 'button';
  b.style.background = hex(p.rgb);
  b.style.setProperty('--mk', 'var(' + MARK[p.block] + ')');
  b.setAttribute('aria-pressed', 'false');
  b.title = p.label + ' · ' + p.block + ' · ' + p.min.toFixed(1) + ' min';
  b.setAttribute('aria-label', p.label + ', ' + p.block);
  b.addEventListener('click', () => show(i));
  strip.appendChild(b);
});

function predictRGB(fA, fB, fC) {
  const e = D.eps, s = D.cam.sen, k = D.cam.k, o = [0, 0, 0];
  for (let j = 0; j < NV; j++) {
    const w = j + V0;
    const t = Math.pow(10, -k * (fA * e[0][w] + fB * e[1][w] + fC * e[2][w]));
    o[0] += s[0][j] * t; o[1] += s[1][j] * t; o[2] += s[2][j] * t;
  }
  return [o[0] * D.cam.W[0], o[1] * D.cam.W[1], o[2] * D.cam.W[2]];
}

function ticks(lo, hi, want) {
  const raw = (hi - lo) / want, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag, step = (n >= 5 ? 10 : n >= 2 ? 5 : n >= 1 ? 2 : 1) * mag, out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(v);
  return out;
}
const fmt = v => Math.abs(v) >= 100 ? v.toFixed(0)
  : Math.abs(v) >= 1 ? String(Math.round(v * 100) / 100) : String(Math.round(v * 1000) / 1000);
const put = (el, w, h, g) => {
  el.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  el.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  el.innerHTML = g.join('');
};

function chart(el, series, o) {
  const w = o.w || 560, h = o.h || 320;
  const m = {l: 46, r: 12, t: series.length > 1 || o.overlay ? 22 : 10, b: 32};
  const xs = o.xRange, cum = [];
  if (o.stack) {
    let run = series[0].y.map(() => 0);
    series.forEach(s => { run = run.map((v, i) => v + s.y[i]); cum.push(run.slice()); });
  }
  const tops = o.stack ? cum[cum.length - 1] : series.flatMap(s => s.y);
  const yMax = Math.max(...tops, ...(o.overlay ? o.overlay.y : []));
  const yt = ticks(0, yMax, 4), top = Math.max(yMax, yt[yt.length - 1]);
  const X = v => m.l + (v - xs[0]) / (xs[1] - xs[0]) * (w - m.l - m.r);
  const Y = v => h - m.b - v / top * (h - m.t - m.b);
  const g = [], ink = css('--ink2'), grid = css('--grid'), rule = css('--rule');
  yt.forEach(v => {
    g.push('<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' +
      Y(v).toFixed(1) + '" stroke="' + grid + '" stroke-width="1"/>');
    g.push('<text x="' + (m.l - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="' + ink + '">' + fmt(v) + '</text>');
  });
  ticks(xs[0], xs[1], 6).forEach(v => g.push('<text x="' + X(v).toFixed(1) + '" y="' +
    (h - m.b + 14) + '" text-anchor="middle" font-size="10" fill="' + ink + '">' + fmt(v) + '</text>'));
  g.push('<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + (h - m.b) + '" y2="' + (h - m.b) + '" stroke="' + rule + '" stroke-width="1"/>');
  series.forEach((s, k) => {
    const up = s.x.map((v, i) => X(v).toFixed(1) + ',' + Y((o.stack ? cum[k] : s.y)[i]).toFixed(1)).join(' ');
    const lo = o.stack ? (k ? cum[k - 1] : s.y.map(() => 0)) : s.y.map(() => 0);
    const dn = s.x.map((v, i) => X(v).toFixed(1) + ',' + Y(lo[i]).toFixed(1)).reverse().join(' ');
    g.push('<polygon points="' + up + ' ' + dn + '" fill="' + s.color + '" fill-opacity="' + (o.stack ? 0.6 : 0.14) + '" stroke="none"/>');
    g.push('<polyline points="' + up + '" fill="none" stroke="' + s.color + '" stroke-width="1.3" stroke-linejoin="round"/>');
  });
  if (o.overlay) g.push('<polyline points="' + o.overlay.x.map((v, i) => X(v).toFixed(1) + ',' +
    Y(o.overlay.y[i]).toFixed(1)).join(' ') + '" fill="none" stroke="' + o.overlay.color +
    '" stroke-width="1.7" stroke-dasharray="5 3"/>');
  const items = series.map(s => ({n: s.name, c: s.color}));
  if (o.overlay) items.push({n: o.overlay.name, c: o.overlay.color});
  if (items.length > 1) {
    let x = m.l;
    items.forEach(s => {
      g.push('<rect x="' + x + '" y="4" width="8" height="8" rx="2" fill="' + s.c + '"/>');
      g.push('<text x="' + (x + 12) + '" y="11.5" font-size="10" fill="' + ink + '">' + esc(s.n) + '</text>');
      x += 24 + s.n.length * 5.8;
    });
  }
  g.push('<text x="' + ((m.l + w - m.r) / 2) + '" y="' + (h - 2) + '" text-anchor="middle" font-size="10.5" fill="' + ink + '">' + esc(o.xLabel) + '</text>');
  g.push('<text transform="translate(11,' + ((m.t + h - m.b) / 2) + ') rotate(-90)" text-anchor="middle" font-size="10.5" fill="' + ink + '">' + esc(o.yLabel) + '</text>');
  put(el, w, h, g);
}

const rad = s => 3.4 + 6 * (s - 0.15) / 0.55;

function spaceView() {
  const el = $('space'), W = 420, H = mode === 'tern' ? 400 : 460;
  const ink = css('--ink2'), rule = css('--rule'), grid = css('--grid'), ring = css('--ring');
  const g = [];
  if (mode === 'tern') {
    const pad = 42, side = W - 2 * pad, hgt = side * 0.866, oy = H - pad - 12;
    const X = ([a, b, c]) => pad + (a + 0.5 * c) * side, Y = ([a, b, c]) => oy - c * hgt;
    const N = 34;
    for (let i = 0; i < N; i++) for (let j = 0; j < N - i; j++) {
      const tri = (q1, q2, q3, cu, cv2) => {
        const rgb = hex(predictRGB(cu * strength, cv2 * strength, (1 - cu - cv2) * strength));
        g.push('<polygon points="' + [q1, q2, q3].map(q => X(q).toFixed(1) + ',' + Y(q).toFixed(1))
          .join(' ') + '" fill="' + rgb + '" stroke="' + rgb + '" stroke-width="0.7"/>');
      };
      tri([i / N, j / N, 1 - i / N - j / N], [(i + 1) / N, j / N, 1 - (i + 1) / N - j / N],
          [i / N, (j + 1) / N, 1 - i / N - (j + 1) / N], (i + 1 / 3) / N, (j + 1 / 3) / N);
      if (j < N - i - 1) tri([(i + 1) / N, j / N, 1 - (i + 1) / N - j / N],
        [i / N, (j + 1) / N, 1 - i / N - (j + 1) / N],
        [(i + 1) / N, (j + 1) / N, 1 - (i + 1) / N - (j + 1) / N], (i + 2 / 3) / N, (j + 2 / 3) / N);
    }
    const V = {A: [1, 0, 0], B: [0, 1, 0], C: [0, 0, 1]};
    g.push('<polygon points="' + ['A', 'B', 'C'].map(k => X(V[k]) + ',' + Y(V[k])).join(' ') +
      '" fill="none" stroke="' + rule + '" stroke-width="1.2"/>');
    [['A', css('--A'), 18], ['B', css('--B'), 18], ['C', css('--C'), -9]].forEach(([k, c, dy]) =>
      g.push('<text x="' + X(V[k]) + '" y="' + (Y(V[k]) + dy) + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + c + '">' + k + '</text>'));
    P.forEach((p, i) => {
      if (Math.abs(p.strength - strength) > 0.02 && i !== sel) return;
      g.push('<circle class="pt" data-i="' + i + '" cx="' + X(p.hue).toFixed(1) + '" cy="' +
        Y(p.hue).toFixed(1) + '" r="' + (i === sel ? 8 : 6) + '" fill="' + hex(p.rgb) + '" stroke="' +
        (i === sel ? ring : '#fff') + '" stroke-opacity="' + (i === sel ? 1 : .85) + '" stroke-width="' +
        (i === sel ? 2.6 : 1.4) + '"><title>' + esc(p.label) + '</title></circle>');
    });
    g.push('<text x="' + W / 2 + '" y="' + (H - 4) + '" text-anchor="middle" font-size="10.5" fill="' + ink + '">dye ratio A : B : C at this dye fraction &mdash; field predicted, dots measured</text>');
    put(el, W, H, g); return;
  }
  const isXy = mode === 'xy';
  const m = {l: 44, r: 14, t: 12, b: 34};
  const [xlo, xhi, ylo, yhi] = isXy ? [0, 0.8, 0, 0.9] : [-75, 70, -45, 115];
  const X = v => m.l + (v - xlo) / (xhi - xlo) * (W - m.l - m.r);
  const Y = v => H - m.b - (v - ylo) / (yhi - ylo) * (H - m.t - m.b);
  ticks(xlo, xhi, 4).forEach(v => {
    g.push('<line x1="' + X(v).toFixed(1) + '" x2="' + X(v).toFixed(1) + '" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="' + grid + '" stroke-width="1"/>');
    g.push('<text x="' + X(v).toFixed(1) + '" y="' + (H - m.b + 14) + '" text-anchor="middle" font-size="10" fill="' + ink + '">' + fmt(v) + '</text>');
  });
  ticks(ylo, yhi, 4).forEach(v => {
    g.push('<line y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" x1="' + m.l + '" x2="' + (W - m.r) + '" stroke="' + grid + '" stroke-width="1"/>');
    g.push('<text x="' + (m.l - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="' + ink + '">' + fmt(v) + '</text>');
  });
  const poly = pts => pts.map(q => X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1)).join(' ');
  if (isXy) {
    g.push('<polygon points="' + poly(D.locus) + '" fill="none" stroke="' + ink + '" stroke-width="1" stroke-opacity="0.55"/>');
    g.push('<polygon points="' + poly(D.srgb_tri) + '" fill="none" stroke="' + ink + '" stroke-width="0.9" stroke-opacity="0.35" stroke-dasharray="2 3"/>');
    g.push('<text x="' + X(0.62) + '" y="' + Y(0.36) + '" font-size="9.5" fill="' + ink + '" fill-opacity="0.6">sRGB</text>');
  } else {
    g.push('<line x1="' + X(0).toFixed(1) + '" x2="' + X(0).toFixed(1) + '" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="' + rule + '" stroke-width="1.2"/>');
    g.push('<line y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '" x1="' + m.l + '" x2="' + (W - m.r) + '" stroke="' + rule + '" stroke-width="1.2"/>');
  }
  const G = isXy ? D.gamut.xy : D.gamut.lab;
  g.push('<polygon points="' + poly(G.full) + '" fill="' + ink + '" fill-opacity="0.055" stroke="' + ink + '" stroke-width="1.3" stroke-dasharray="6 4"/>');
  const key = ['0.15', '0.3', '0.5', '0.7', '1.0'].reduce((a, b) =>
    Math.abs(+b - strength) < Math.abs(+a - strength) ? b : a);
  g.push('<polygon points="' + poly(G.at[key] || G.at['0.5']) + '" fill="none" stroke="' + ring + '" stroke-opacity="0.5" stroke-width="1.2"/>');
  if (isXy) {
    g.push('<circle cx="' + X(D.white[0]).toFixed(1) + '" cy="' + Y(D.white[1]).toFixed(1) + '" r="3" fill="none" stroke="' + ink + '" stroke-width="1"/>');
    g.push('<text x="' + (X(D.white[0]) + 6) + '" y="' + (Y(D.white[1]) - 4) + '" font-size="9.5" fill="' + ink + '">D65</text>');
  }
  P.forEach((p, i) => {
    const q = isXy ? p.xy : [p.lab[1], p.lab[2]];
    g.push('<circle class="pt" data-i="' + i + '" cx="' + X(q[0]).toFixed(1) + '" cy="' + Y(q[1]).toFixed(1) +
      '" r="' + rad(p.strength).toFixed(1) + '" fill="' + hex(p.uvrgb) + '" stroke="' +
      (i === sel ? ring : rule) + '" stroke-width="' + (i === sel ? 2.6 : 0.8) + '"><title>' +
      esc(p.label + ' · L* ' + p.lab[0].toFixed(0)) + '</title></circle>');
  });
  g.push('<text x="' + ((m.l + W - m.r) / 2) + '" y="' + (H - 3) + '" text-anchor="middle" font-size="10.5" fill="' + ink + '">' + (isXy ? 'x' : 'a*  (green &minus; / red +)') + '</text>');
  g.push('<text transform="translate(11,' + ((m.t + H - m.b) / 2) + ') rotate(-90)" text-anchor="middle" font-size="10.5" fill="' + ink + '">' + (isXy ? 'y' : 'b*  (blue &minus; / yellow +)') + '</text>');
  put(el, W, H, g);
}

function drawUV() {
  const p = P[sel], dye = [css('--A'), css('--B'), css('--C')];
  const stacked = uvMode === 'stacked';
  $('uvnote').textContent = stacked
    ? "each dye's share, stacked — the top of the stack is the sum"
    : "each dye's share at its true height, overlaid";
  chart($('uv'), D.dyes.map((n, k) => ({name: n + ' \u00d7 ' + p.frac[k].toFixed(3), x: D.wl,
    y: D.eps[k].map(v => v * p.frac[k]), color: dye[k]})),
    {stack: stacked, overlay: {name: 'measured', x: D.wl, y: p.spec, color: css('--measured')},
     xRange: [D.wl[0], D.wl[D.wl.length - 1]], xLabel: 'wavelength (nm)', yLabel: 'absorbance',
     w: 600, h: 300});
}

function drawSpace() {
  $('sval').textContent = strength.toFixed(2);
  $('camnote').textContent = mode === 'tern'
    ? 'Predicted through a fitted camera: channels ' + D.cam.peaks.join(' / ') + ' nm, ' +
      D.cam.path_mm + ' mm of dye against the ' + D.cam.cell_mm + ' mm cell.'
    : 'CIE 1931, D65. Dashed outline: every color these three dyes reach. Solid: the limit at this dye fraction.';
  spaceView();
}

function show(i) {
  sel = (i + P.length) % P.length;
  const p = P[sel];
  [...strip.children].forEach((c, k) => c.setAttribute('aria-pressed', k === sel ? 'true' : 'false'));
  $('frame').src = 'data:image/jpeg;base64,' + p.img;
  $('tag').textContent = p.label + ' · ' + p.block + ' · ' + p.min.toFixed(1) + ' min';
  $('sw').style.background = hex(p.rgb);
  $('swp').style.background = hex(p.pred);
  $('hex').textContent = hex(p.rgb).toUpperCase();
  $('rgbtxt').textContent = 'R ' + p.rgb[0].toFixed(0) + '  G ' + p.rgb[1].toFixed(0) +
    '  B ' + p.rgb[2].toFixed(0) + '   of 255';
  $('detxt').textContent = 'predicted ' + hex(p.pred).toUpperCase() + '   ΔE ' + p.dE.toFixed(2);
  $('pumps').innerHTML = ['A', 'B', 'C', 'D'].map(k => '<div><b><span class="dot" style="background:var(--' +
    k + ')"></span>' + k + '</b><span>' + p.q[k].toFixed(2) + '</span></div>').join('');
  const cols = [css('--chR'), css('--chG'), css('--chB')];
  chart($('hist'), ['R', 'G', 'B'].map((n, c) => ({name: n, x: D.bins, y: p.hist[c], color: cols[c]})),
    {xRange: [80, 240], xLabel: 'level (0–255)', yLabel: 'weighted pixels', w: 300, h: 260});
  drawUV();
  strength = p.strength; $('srange').value = String(Math.round(strength * 100));
  drawSpace(); drawMask();
}

function drawMask() {
  const svg = $('overlay');
  svg.setAttribute('viewBox', '0 0 ' + FW + ' ' + FH);
  if (!$('showmask').checked) { svg.innerHTML = ''; return; }
  const s = 6.4, c = D.centre;
  svg.innerHTML = '<polygon points="' + c.map((y, x) => x + ',' + (y - s)).join(' ') + ' ' +
    c.map((y, x) => x + ',' + (y + s)).reverse().join(' ') +
    '" fill="none" stroke="#7CFC00" stroke-opacity="0.85" stroke-width="0.7"/>';
}

['space'].forEach(id => $(id).addEventListener('click', e => {
  const c = e.target.closest('circle.pt');
  if (c) show(+c.dataset.i);
}));
[['uStack', 'stacked'], ['uOver', 'overlaid']].forEach(([id, m]) =>
  $(id).addEventListener('click', () => {
    uvMode = m;
    $('uStack').setAttribute('aria-pressed', m === 'stacked' ? 'true' : 'false');
    $('uOver').setAttribute('aria-pressed', m === 'overlaid' ? 'true' : 'false');
    drawUV();
  }));
[['mTern', 'tern'], ['mXy', 'xy'], ['mLab', 'lab']].forEach(([id, m]) =>
  $(id).addEventListener('click', () => {
    mode = m;
    [['mTern', 'tern'], ['mXy', 'xy'], ['mLab', 'lab']].forEach(([j, n]) =>
      $(j).setAttribute('aria-pressed', n === mode ? 'true' : 'false'));
    drawSpace();
  }));
$('srange').addEventListener('input', e => { strength = +e.target.value / 100; drawSpace(); });
$('prev').addEventListener('click', () => show(sel - 1));
$('next').addEventListener('click', () => show(sel + 1));
$('showmask').addEventListener('change', drawMask);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') { show(sel - 1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { show(sel + 1); e.preventDefault(); }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => show(sel), 150); });
show(0);
</script>
</body>
</html>
