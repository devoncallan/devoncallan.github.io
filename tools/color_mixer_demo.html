<!doctype html>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COAST PCL Color Mixer</title>
<style>
/* Chrome both demos wear: tokens, dark mode, header, settings panel,
   chips, cards, buttons, the wheel's cells, the camera feed. */
:root{
 --bg:#dceaf7;--surface:#fff;--rule:#dce3ea;--ink:#0b2540;--ink2:#435568;--muted:#738396;
 --navy:#003660;--blue:#2774ae;--gold:#f7b629;--glass:#f6f9fc;--bad:#c42b3f;--good:#1a8f4c;
 --ring:#ff4d5e,#ffa31a,#ffe03a,#3fd07f,#27b6f0,#5b6bff,#d44fd6,#ff4d5e;
 --sans:"Avenir Next","Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 font-size:clamp(15px,1.85vmin,24px)}
:root[data-theme=dark]{
 --bg:#0a1521;--surface:#112233;--rule:#223a50;--ink:#eef3f8;--ink2:#b1c0ce;--muted:#8093a6;
 --navy:#1d4a78;--glass:#1a2e42;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0a1521;--surface:#112233;--rule:#223a50;--ink:#eef3f8;--ink2:#b1c0ce;--muted:#8093a6;
 --navy:#1d4a78;--glass:#1a2e42;color-scheme:dark}}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.35 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1rem;padding:1rem 1.2rem 1.2rem}
header{display:flex;align-items:center;gap:1rem}
header .logo{height:3.4rem;width:auto;display:block}
header .logo.d,:root[data-theme=dark] header .logo.l{display:none}
:root[data-theme=dark] header .logo.d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) header .logo.l{display:none}:root:not([data-theme=light]) header .logo.d{display:block}}
.theme{padding:0;width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.theme:hover{color:var(--ink);background:var(--surface)}
.theme:focus-visible{outline:3px solid var(--blue)}
.theme svg{width:1.25rem;height:1.25rem}
.gear{position:relative}
.panel{position:absolute;right:0;top:110%;z-index:20;min-width:15rem;padding:.9rem 1rem;
 background:var(--surface);border:1px solid var(--rule);border-radius:.9rem;
 box-shadow:0 12px 32px rgba(0,0,0,.18);display:grid;gap:.75rem}
.panel[hidden]{display:none}
.panel h3{margin:0;font:700 .8rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel label{display:flex;align-items:center;gap:.8rem;font:600 1rem/1.2 var(--sans);color:var(--ink2);cursor:pointer}
.panel label span{flex:1}
.panel select{font:600 .95rem var(--sans);padding:.35em .5em;border-radius:.5rem;
 border:1.5px solid var(--rule);background:var(--surface);color:var(--ink)}
.panel input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--blue);margin:0}
.feed .turn.flip{transform:rotate(180deg)}
h1{font-size:2.3rem;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1 span{color:var(--blue)}
header .grow{flex:1}
.chip.busy{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0}

.pick{flex:1}
path.cell{cursor:pointer;transition:stroke-width .12s}
path.cell:hover{stroke:var(--ink);stroke-width:2}
path.on{stroke:var(--ink);stroke-width:3.5}
.go .make{flex:1 1 100%}
.go button:not(.make){flex:1}
button{font:700 1.3rem/1 var(--sans);padding:1rem 1.4rem;border-radius:1rem;border:2px solid var(--rule);
 background:var(--surface);color:var(--ink);cursor:pointer}
.make::before,.make::after{content:"";position:absolute;inset:-5px;border-radius:1.3rem;z-index:-2;
 background:conic-gradient(from var(--spin),var(--ring));animation:spin 5s linear infinite}
.make::after{z-index:-3;filter:blur(14px);opacity:.35;transition:opacity .2s}
.make span{position:relative;z-index:1}
.make b{position:absolute;inset:0;border-radius:1rem;z-index:-1;background:var(--navy)}
.make:hover:not(:disabled){transform:translateY(-2px)}
.make:hover:not(:disabled)::before,.make:hover:not(:disabled)::after{animation-duration:1.6s}
.make:hover:not(:disabled)::after{opacity:.75}
.make:active:not(:disabled){transform:translateY(1px)}
.make:disabled::before,.make:disabled::after{animation-duration:.7s}
.make:disabled::after{opacity:.9}
@keyframes spin{to{--spin:360deg}}
.feed .turn{position:absolute;inset:0;transition:transform .2s}
@keyframes pulse{70%{box-shadow:0 0 0 .5rem rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.feed img,.feed canvas{position:absolute;display:block;max-width:none}
.feed{position:relative;min-height:0;border-radius:.7rem;overflow:hidden;background:#000}
.feed svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed svg.ov[hidden]{display:none}
.feed svg.ov polygon{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.7);
 stroke-width:1.5;vector-effect:non-scaling-stroke}
.live{position:absolute;top:.7rem;left:.7rem;display:flex;align-items:center;gap:.45em;
 padding:.4em .75em;border-radius:.5rem;background:rgba(0,0,0,.58);color:#fff;
 font:700 .85rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.live[hidden]{display:none}
.live i{width:.6rem;height:.6rem;border-radius:50%;background:#ff3b3b;
 box-shadow:0 0 0 0 rgba(255,59,59,.7);animation:pulse 1.6s ease-out infinite}
.live.down i{background:#9aa5b1;animation:none}
/* target beside measured, split down the middle */
.pair{min-height:0;display:flex;border-radius:.8rem;overflow:hidden;border:1px solid var(--rule)}
.pair .half{flex:1;position:relative;min-width:0;background:var(--bg);transition:background-color .35s}
.pair .seam{width:9px;background:var(--surface);flex:none}
/* the label stacks over the hex, so the chip never outgrows a narrow half */
.tag{position:absolute;bottom:.7rem;left:.7rem;max-width:calc(100% - 1.4rem);
 display:grid;gap:.25em;justify-items:start;padding:.45em .6em;border-radius:.5rem;
 background:rgba(255,255,255,.85);color:#0b2540}
.tag em{font:700 .72rem/1 var(--sans);font-style:normal;letter-spacing:.14em;
 text-transform:uppercase;opacity:.75}
.tag b{font:700 clamp(.95rem,1.45vmin,1.5rem)/1 var(--mono)}
:root[data-theme=dark] .tag{background:rgba(10,21,33,.75);color:#eef3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{background:rgba(10,21,33,.75);color:#eef3f8}}
/* progress, as a fill clipped to the button's own shape */
.make em{position:absolute;inset:0;z-index:-1;border-radius:1rem;overflow:hidden;
 opacity:0;transition:opacity .25s}
.make.busy em{opacity:1}
.make u{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue);
 transition:width .15s linear}
</style>
<style>
:root{
 --yellow:#f2c418;--red:#d3223a;--dblue:#1f6fd8;--water:#cfe6f5}
:root[data-theme=dark]{--water:#6f93ad}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--water:#6f93ad}}
.chip{font:700 .85rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
 padding:.6em 1em;border:2px solid var(--rule);border-radius:99px;color:var(--ink2);white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:1rem;min-height:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:1rem;padding:1rem 1.2rem;
 display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--blue),var(--gold))}
h2{font:700 1.25rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
 margin:.2rem 0 .8rem;display:flex;align-items:center;gap:1rem}
h2 .where{margin-left:auto;display:flex;align-items:center;gap:.35em;text-transform:none;letter-spacing:0;font:600 1.15rem/1 var(--sans);color:var(--ink2)}
h2 .where svg{width:1.2em;height:1.2em;fill:var(--blue)}
#wheel{flex:1;min-height:0;width:100%;height:100%;display:block}
path.cell.off{pointer-events:none}

.recipe{flex:1;justify-content:space-between;gap:.6rem}
#bottles{width:100%;flex:1;min-height:0;display:block}
#bottles text{font:700 21px var(--sans);fill:var(--ink2);text-anchor:middle}
#bottles .glass{fill:var(--glass);stroke:var(--ink2);stroke-width:1.6}
#bottles .rim{fill:none;stroke:var(--ink2);stroke-width:1.6}
#bottles .cap{fill:var(--navy)}
#bottles .shine{fill:#fff;opacity:.45}
#bottles .bottle{transition:opacity .25s}
#bottles .bottle.idle{opacity:.38}
#bottles .feed{fill:none;stroke-linecap:round;transition:stroke-width .25s}
#bottles .flow{fill:none;stroke-linecap:round;stroke:#fff;stroke-opacity:.55;stroke-dasharray:3 14;opacity:0}
.running #bottles .flow{opacity:1;animation:run .6s linear infinite}
@keyframes run{to{stroke-dashoffset:-17}}
#bottles .mixed{transition:fill .4s,stroke .4s}
.running #bottles .bob{animation:bob 1.1s ease-in-out infinite}
.running #bottles .idle .bob{animation:none}
@keyframes bob{50%{transform:translateY(-3px)}}

.mix{position:relative;height:3.4rem;border-radius:.8rem;overflow:hidden;background:var(--bg);
 border:1px solid var(--rule);touch-action:none;user-select:none;flex:none}
.seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
 font:700 1.3rem/1 var(--mono);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.seg.light{color:#2b2200;text-shadow:none}
.seg span{transition:opacity .12s}
.seg.thin span{opacity:0}
.grip{position:absolute;top:-1px;bottom:-1px;width:1.1rem;margin-left:-.55rem;cursor:ew-resize;
 background:var(--surface);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.grip::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:1.4rem;margin:-.7rem 0 0 -2px;border-radius:2px;background:var(--muted)}
.grip:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.strength{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "s s";align-items:center;column-gap:1rem;flex:none}
.strength b{grid-area:l}.strength .v{grid-area:v}.strength input{grid-area:s}
.strength b{font-size:1.3rem;font-weight:700}
.strength .v{font:700 1.4rem/1 var(--mono);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:.7rem;border-radius:99px;background:linear-gradient(90deg,var(--water),var(--navy))}
input[type=range]::-moz-range-track{height:.7rem;border-radius:99px;background:linear-gradient(90deg,var(--water),var(--navy))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.8rem;height:1.8rem;margin-top:-.55rem;border-radius:50%;background:var(--surface);border:4px solid var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:1.3rem;height:1.3rem;border-radius:50%;background:var(--surface);border:4px solid var(--navy)}
input[type=range]:focus-visible{outline:3px solid var(--blue);outline-offset:4px;border-radius:99px}

.go{display:flex;flex-wrap:wrap;gap:1rem;align-items:stretch;flex:none;padding:6px 6px 2px}
#halt{border-color:var(--bad);color:var(--bad)}
#halt:not(:disabled):hover{background:var(--bad);color:#fff}
button:disabled{cursor:default}
#blank:disabled{opacity:.45}
.make{flex:1;white-space:nowrap;position:relative;isolation:isolate;border:0;color:#fff;font-size:1.6rem;letter-spacing:.01em;
 background:transparent;--mx:50%;--my:50%;transition:transform .15s}
.make i{position:absolute;inset:0;border-radius:1rem;z-index:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .2s}
.make:hover:not(:disabled) i{opacity:1}
.err{color:var(--bad);font:600 1.05rem/1.35 var(--mono);min-height:0;flex:none}
.err:empty{display:none}

.tube{flex:1.85}
.feed{flex:1}
.pair{flex:.62;margin-top:.9rem}
.spec{flex:1.5}
.spin{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
.spec.busy .spin{display:grid}
.spec.busy #plot .data{opacity:0}
.spin i{width:4.6rem;height:4.6rem;border-radius:50%;border:6px solid var(--rule);
 border-top-color:var(--blue);animation:turn .9s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.plot{flex:1;min-height:0}
.plot text{font:600 1.05rem var(--sans);fill:var(--muted)}
.plot text.ax{font:700 1rem var(--sans);letter-spacing:.02em;fill:var(--muted)}

@media (max-width:1180px){.make{font-size:1.3rem}.go button{padding:.9rem 1rem}}
@media (max-width:900px),(max-aspect-ratio:1/1){
 body{overflow:auto}
 .app{height:auto}
 main{grid-template-columns:1fr}
 .pick #wheel{height:auto;aspect-ratio:1}
 .feed{height:14rem;flex:none}
 .plot{height:16rem;flex:none}
 .col .card{flex:none}
 #bottles{flex:none;height:22rem}
}
</style>
<script>try{var t=localStorage.getItem('mixer-theme')||'light';if(t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>

 <section class="card recipe" id="recipe">
  <h2>Recipe</h2>
  <svg id="bottles" viewBox="0 0 400 330" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="mix" id="mix">
   <div class="seg light" id="segA" style="background:var(--yellow)"><span>33%</span></div>
   <div class="seg" id="segB" style="background:var(--red)"><span>33%</span></div>
   <div class="seg" id="segC" style="background:var(--dblue)"><span>33%</span></div>
   <div class="grip" id="g1" tabindex="0" role="slider" aria-label="Yellow against red"></div>
   <div class="grip" id="g2" tabindex="0" role="slider" aria-label="Red against blue"></div>
  </div>
  <label class="strength"><b>Dye strength</b><input type="range" id="s" min="0.1" max="99" step="0.1" value="40"><span class="v" id="sv">40%</span></label>
  <div class="go"><button class="make" id="go"><b></b><em><u id="fill"></u></em><i></i><span id="golabel">Make color</span></button><button id="blank">Clear</button><button id="halt" disabled>Stop</button></div>
  <div class="err" id="err"></div>
 </section>

 <div class="col">
  <section class="card tube"><h2>Webcam feed
    <span class="where"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.6a2.6 2.6 0 1 1 0-5.2 2.6 2.6 0 0 1 0 5.2z"/></svg>Santa Barbara, CA</span></h2>
   <div class="feed" id="feed"><div class="turn"><img id="cam" alt="">
    <svg class="ov" id="ov" preserveAspectRatio="xMidYMid slice"></svg></div>
    <span class="live" id="live"><i></i><span>Live</span></span></div>
   <div class="pair">
    <div class="half" id="halfT"><span class="tag"><em>Target</em><b id="hexT">&mdash;</b></span></div>
    <div class="seam"></div>
    <div class="half" id="halfM"><span class="tag"><em>Measured</em><b id="hexv">&mdash;</b></span></div>
   </div></section>
  <section class="card spec" id="spec"><h2>Visible light spectrum</h2>
   <div class="plot" id="plot"></div><div class="spin"><i></i></div></section>
 </div>
</main>
</div>

<script>
/* The pieces both demos share that are not the wheel or the tube: colour
   conversion, the settings panel, and the progress that fills the Make/Match
   button while the rig works. */
window.Coast = (function () {
var M_INV = [[3.2406, -1.5372, -0.4986], [-0.9689, 1.8758, 0.0415], [0.0557, -0.2040, 1.0570]];
var WP = [0.9505, 1.0, 1.0890];

function lab2rgb(L, a, b) {
 var fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200, d = 6 / 29;
 var f = function (t) { return t > d ? t * t * t : 3 * d * d * (t - 4 / 29) };
 var xyz = [f(fx) * WP[0], f(fy) * WP[1], f(fz) * WP[2]];
 return M_INV.map(function (r) {
  var v = r[0] * xyz[0] + r[1] * xyz[1] + r[2] * xyz[2];
  v = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(Math.max(v, 0), 1 / 2.4) - 0.055;
  return Math.round(Math.min(1, Math.max(0, v)) * 255);
 });
}
function rgb(v) { return 'rgb(' + v.map(Math.round).join(',') + ')' }
function hex(v) {
 return '#' + v.map(function (x) {
  return Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0');
 }).join('').toUpperCase();
}

/* ---- the settings panel behind the gear ---- */
function panel(button, box) {
 var open = function (on) { box.hidden = !on; button.setAttribute('aria-expanded', String(on)) };
 button.addEventListener('click', function (e) { e.stopPropagation(); open(box.hidden) });
 document.addEventListener('click', function (e) {
  if (!box.hidden && !e.target.closest('.gear')) open(false);
 });
 addEventListener('keydown', function (e) { if (e.key === 'Escape') open(false) });
 return open;
}
function theme(value) {
 var root = document.documentElement;
 if (value === 'auto') delete root.dataset.theme; else root.dataset.theme = value;
 try { value === 'auto' ? localStorage.removeItem('mixer-theme')
                        : localStorage.setItem('mixer-theme', value) } catch (e) {}
}
function savedTheme() {
 /* light by default: these run on projectors and in bright rooms, and a page
    that guesses dark from the machine's setting is the wrong guess there */
 try { return localStorage.getItem('mixer-theme') || 'light' } catch (e) { return 'light' }
}

/* ---- progress, as a fill across the button that was pressed ----
   The rig reports a step and how long it has been going, on its own cadence; the
   page runs the seconds in between so the fill moves instead of stepping. */
function progress(button, fill, label, idle) {
 var at = { on: false }, WORD = { dispensing: 'Mixing', measuring: 'Measuring' };
 var titled = function (w) {
  return w ? (WORD[w] || w[0].toUpperCase() + w.slice(1)) + '…' : idle;
 };
 setInterval(function () {
  if (!at.on) return;
  var d = Math.min(at.total, at.done + (performance.now() - at.t0) / 1000);
  fill.style.width = (100 * d / at.total).toFixed(1) + '%';
  label.textContent = titled(at.step) + '  ' + Math.max(0, Math.ceil(at.total - d)) + 's';
 }, 100);
 return function (step, secs, done) {
  var on = !!step, total = secs || 1;
  at = { on: on, t0: performance.now(), done: Math.max(0, Math.min(done || 0, total)),
         total: total, step: step };
  button.classList.toggle('busy', on);
  if (!on) { fill.style.width = '0'; label.textContent = idle }
  return on;
 };
}

return { lab2rgb: lab2rgb, rgb: rgb, hex: hex,
         panel: panel, theme: theme, savedTheme: savedTheme, progress: progress };
})();
</script>
<script>
/* The colour wheel both demos pick from. One implementation, so "the wheels are
   the same" is true by construction rather than by eye.

   Only the outer ring can be made on demand: the inner rings are the same hues at
   lower strength, shown in grey so the reachable rim reads as the edge of what the
   rig will mix, and left unclickable so nobody picks one. */
window.Wheel = (function () {
var CX = 260, CY = 260, R0 = 44, R1 = 250, GAP = 1.4;

function polar(deg, r) {
 var a = deg * Math.PI / 180;
 return [CX + Math.cos(a) * r, CY - Math.sin(a) * r];
}
function wedge(h0, dh, ra, rb) {
 var p1 = polar(h0 - dh / 2, ra), p2 = polar(h0 + dh / 2, ra);
 var p3 = polar(h0 + dh / 2, rb), p4 = polar(h0 - dh / 2, rb);
 return 'M' + p1[0] + ' ' + p1[1] + 'A' + ra + ' ' + ra + ' 0 0 0 ' + p2[0] + ' ' + p2[1] +
        'L' + p3[0] + ' ' + p3[1] + 'A' + rb + ' ' + rb + ' 0 0 1 ' + p4[0] + ' ' + p4[1] + 'Z';
}
function rgb(v) { return 'rgb(' + v.map(Math.round).join(',') + ')' }
function grey(v) {
 /* no hue, and compressed into a mid band: these cells read as grey and still
    show their structure instead of washing out to near white */
 var y = (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
 var g = Math.round(148 + 70 * y);
 return 'rgb(' + g + ',' + g + ',' + g + ')';
}

/* `cells` is the wheel's own list; each needs hue, ring and rgb.
   `opts.grey` greys the inner rings and takes them out of play. The mixer wants
   that -- its strength slider reaches those colours anyway, so the rim is the
   only thing worth clicking. The target has no slider: there the wheel is the
   whole choice, so every ring stays live. */
function draw(svg, cells, opts) {
 var greyInner = !opts || opts.grey !== false;
 var NR = 0, hues = {};
 cells.forEach(function (c) { NR = Math.max(NR, c.ring); hues[c.ring === 1 ? c.hue : c.hue] = 1 });
 var NH = Object.keys(hues).length, o = '';
 cells.forEach(function (c, i) {
  var ra = R0 + (c.ring - 1) * (R1 - R0) / NR + GAP, rb = R0 + c.ring * (R1 - R0) / NR - GAP;
  var rim = c.ring === NR, off = greyInner && !rim;
  o += '<path class="cell' + (off ? ' off' : '') + '" d="' + wedge(c.hue, 360 / NH - GAP, ra, rb) +
       '" fill="' + (off ? grey(c.rgb) : rgb(c.rgb)) +
       '" stroke="var(--rule)" stroke-width=".6" data-i="' + i + '"></path>';
 });
 o += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R1 - 0.7) +
      '" fill="none" stroke="var(--ink)" stroke-width="3.5"/>';
 o += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R0 - 4) +
      '" fill="var(--surface)" stroke="var(--rule)"/>';
 o += '<circle id="hub" cx="' + CX + '" cy="' + CY + '" r="' + (R0 - 12) + '" fill="none"/>';
 svg.innerHTML = o;
 return NR;
}

/* The selected cell is moved to the end so its neighbours cannot paint over half
   its outline. That reorders the DOM for good, so the cell is found by data-i and
   never by position -- indexing the node list would drift by one per selection. */
function mark(svg, cells, i) {
 var ps = svg.querySelectorAll('path.cell'), hub = svg.querySelector('#hub'), on = null;
 for (var j = 0; j < ps.length; j++) {
  var is = +ps[j].dataset.i === i;
  ps[j].classList.toggle('on', is);
  if (is) on = ps[j];
 }
 if (on) svg.insertBefore(on, svg.querySelector('circle'));
 if (hub) hub.setAttribute('fill', cells && cells[i] ? rgb(cells[i].rgb) : 'none');
}

/* The rim's colours, as a conic gradient for the Make/Match button's ring. */
function ringCss(cells) {
 var NR = Math.max.apply(null, cells.map(function (c) { return c.ring }));
 var rim = cells.filter(function (c) { return c.ring === NR })
                .sort(function (a, b) { return a.hue - b.hue });
 return rim.length ? rim.concat(rim[0]).map(function (c) { return rgb(c.rgb) }).join(',') : null;
}

return { draw: draw, mark: mark, ringCss: ringCss, rgb: rgb, grey: grey,
         CX: CX, CY: CY, R0: R0, R1: R1 };
})();
</script>
<script>
/* The tube as the camera sees it, drawn for the pages that have no camera.
   Both offline demos mount this, so the tube looks the same in each. */
window.Tube = (function () {
var TOP = 242, FPS = 30;
var WHITE = [170.742, 186.915, 181.804], FIELD = [172.212, 194.646, 192.399], WALL = [145, 159, 155];
var FRAME = [640, 480];
var OUTLINE = [[[0,223],[0,245],[105,262],[184,272],[288,282],[405,289],[500,292],[639,292],[639,270],[457,270],[292,262],[161,249]]];
var CENTRE = [[0,234.0],[40,240.5],[80,247.5],[120,253.0],[160,258.5],[200,263.0],[240,267.0],[280,271.0],[320,274.0],[360,276.0],[400,278.0],[440,279.5],[480,280.5],[520,281.5],[560,281.5],[600,281.0],[639,281.0]];

function light(v){ var c=v/255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4) }
function codes(l){ l=Math.max(0,l); return 255*(l<=0.04045/12.92?l*12.92:1.055*Math.pow(l,1/2.4)-0.055) }
function clamp(v){ return Math.max(0,Math.min(255,v)) }
function gauss(){ return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random()) }


var gain = [0,1,2].map(function(i){ return light(TOP)/light(WHITE[i]) });
function balanced(v){ return 'rgb('+shift(v).map(Math.round).join(',')+')' }
function shift(v){ return v.map(function(x,i){ return clamp(codes(light(x)*gain[i])) }) }
var BASE = shift(FIELD);
var grain = [0,1,2,3].map(function () {
 var c=document.createElement('canvas'); c.width=320; c.height=240;
 var x=c.getContext('2d'), d=x.createImageData(320,240);
 for (var i=0;i<d.data.length;i+=4){ var v=128+40*gauss(); d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255 }
 x.putImageData(d,0,0); return c;
});

/* --- where the new fluid has got to, from the flow rather than drawn by eye ---
   Laminar flow drives a parabolic tongue of fresh fluid down the middle of the
   bore, so the leading edge arrives at half the mean volume and a sheath of the
   old fluid clings to the wall behind it. The coiled tube stirs across the bore
   on the way; MIX is how far that has got by the camera. The rig's own campaign
   repeats to 2 dE, which an unstirred tongue cannot do -- it would leave 13 dE
   of the old colour in view at the read. Devon sees colour inside a second, which
   puts the tee about 0.25 mL upstream; at that distance MIX = 0.5 still clears the
   2 dE bar, and the slow wall layer sits in the tube longest so it mixes away
   faster than one fixed MIX allows. The tee behaves as a small stirred volume
   too, so what enters the tube walks from the old colour to the new rather than
   stepping. Explorer: "Claude outputs/tube-front-models.html". */
/* V_VIEW is the tube the camera actually frames -- a close-up of a few cm, not
   the 0.30 mL first guessed, which made everything crawl. At 8 mL/min the fluid
   crosses this window in V_VIEW/Q, so 0.05 mL is about a third of a second. */
var V_DEAD = 0.15, V_VIEW = 0.07, SPREAD = 0.05, MIX = 0.5, V_MIX = 0.12, ROWS = 26;
/* Striations, not slugs. The tee hands over lamellae of the separate dyes and
   almost nothing stirs them back together, so they run as fine lines ALONG the
   flow rather than bands across it. Fluid at the wall crawls while fluid at the
   centre races, so neighbouring lines shear past each other and break up over
   about L_BREAK of travel. It scales absorbance, so it vanishes in clear
   solvent. A pale mix shows them most: there the dye pumps sit near their floor
   and the tee is being asked for a hundredfold dilution, which it does
   relatively worse -- so LIFT raises the amplitude as the fluid gets lighter.
   The pumps stopping does not freeze the pattern; the lines are fine enough
   that diffusion erases them in RELAX_S, far quicker than the ~500 s the full
   bore would take. Nothing on the rig measures any of these. */
var L_BREAK = 0.005, GRAIN = 0.22, LIFT = 0.45, RELAX_S = 15;

function erfc(z) {
 var s = z < 0 ? -1 : 1, x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
 var y = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
   - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
 return 1 - s * (1 - y);
}

/* u runs 0 to 1 across the camera's window; v is the mL pushed since the change.
   `flat` is the share of the bore carrying the new colour evenly, `tip` the share
   inside the tongue of radius `core`, and `f` what the camera averages over. */
function front(u, v) {
 var x = V_DEAD + u * V_VIEW, w = Math.max(0, Math.min(1, 1 - x / (2 * Math.max(v, 1e-9))));
 /* fluid this far along left the tee that much earlier, when the blend was younger */
 var since = function (d) { return 1 - Math.exp(-Math.max(0, v - d) / V_MIX) };
 var flat = MIX * erfc((x - v) / (SPREAD * Math.sqrt(x))) / 2 * since(x);
 var tip = (1 - MIX) * since(x / 2);   /* the tongue runs at twice the mean speed */
 return { flat: flat, core: Math.sqrt(w), tip: tip, x: x, f: flat + tip * w };
}

/* How much richer or leaner this line of sight is than the average. y picks the
   streak, and each depth carries its own material coordinate, so the lines slide
   over one another instead of marching in step. */
function streak(x, y, v, amp) {
 var rush = 2 * (1 - y * y) + 0.08;          /* parabolic, never quite stopped */
 var m = (v - x / rush) / L_BREAK;
 var a = Math.sin(5.6 * y + 1.00 * m + 0.7);
 var b = Math.sin(3.1 * y - 0.62 * m + 2.3);
 var c = Math.sin(1.7 * y + 0.27 * m + 4.1);
 return 1 + amp * (0.50 * a + 0.34 * b * (0.6 + 0.4 * c) + 0.22 * c);
}

/* Looking across a round bore at height y the light travels a chord, not a
   constant depth, so the middle of the tube is always the deepest colour. The
   camera's own reading is the average chord, PI/2 of the radius. */
var MEAN = Math.PI / 2;
/* how hard each channel is absorbed, per unit of path -- fixed for a whole frame,
   along with how strongly this fluid shows its striations */
function depth(old, neu) {
 var k = [0,1,2].map(function (i) {
  return [Math.log(Math.max(neu[i], 1) / BASE[i]) / MEAN,
          Math.log(Math.max(old[i], 1) / BASE[i]) / MEAN];
 });
 var dark = -(k[0][0] + k[1][0] + k[2][0]) / 3 * MEAN;
 return { k: k, amp: GRAIN * Math.min(2.2, LIFT / (Math.max(0, dark) + 0.20)) };
}
function bore(k, m, y, tex) {
 var chord = 2 * Math.sqrt(Math.max(0, 1 - y * y));
 var fresh = Math.min(chord, m.flat * chord
   + m.tip * 2 * Math.sqrt(Math.max(0, m.core * m.core - y * y)));
 var o = k.map(function (c, i) {
  return Math.round(clamp(BASE[i] * Math.exp(tex * (c[0] * fresh + c[1] * (chord - fresh)))));
 });
 return 'rgb(' + o.join(',') + ')';
}

/* `frame()` gives the tube head to tail and whether it is moving: either
   `steps` of ready colours, or `mix` from front() with the two colours to blend */
function paint(el, frame) {
 var cv=document.createElement('canvas');
 cv.id=el.id; cv.width=FRAME[0]; cv.height=FRAME[1];
 cv.style.cssText='position:absolute;display:block';
 el.replaceWith(cv);
 var g=cv.getContext('2d'), last=0, k=0, seen=-1, stopped=0;
 function centre(dy){ g.beginPath(); CENTRE.forEach(function(p,i){ g[i?'lineTo':'moveTo'](p[0],p[1]+dy) }) }
 function band(stops, dy, w) {
  var lg=g.createLinearGradient(0,0,FRAME[0],0);
  stops.forEach(function(c,i){ lg.addColorStop(stops.length>1?i/(stops.length-1):0,c) });
  centre(dy); g.strokeStyle=lg; g.lineWidth=w; g.stroke();
 }
 function draw(ts) {
  requestAnimationFrame(draw);
  if (ts-last < 1000/FPS) return; last=ts;
  var f=frame()||{};
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.fillStyle=balanced(FIELD); g.fillRect(0,0,FRAME[0],FRAME[1]);
  var vg=g.createRadialGradient(320,240,120,320,240,420);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.12)');
  g.fillStyle=vg; g.fillRect(0,0,FRAME[0],FRAME[1]);
  g.lineJoin=g.lineCap='round';
  centre(0); g.strokeStyle=balanced(WALL); g.lineWidth=44; g.stroke();
  if (f.mix && f.mix.length) {
   /* one thin stroke per slice of the bore, so the tongue and the wall sheath show */
   var dye=depth(f.old||BASE, f.neu||BASE), v=f.v||0;
   /* the fluid coasting to a halt is the sim's business; once it is truly still
      the lines relax away instead of freezing on screen */
   /* the coast decays exponentially, so v never settles exactly -- still means
      moving by less than a frame's worth of flow, not byte-identical */
   if (Math.abs(v-seen) > 1e-4) { seen=v; stopped=ts }
   var amp=dye.amp*Math.exp(-(ts-stopped)/1000/RELAX_S);
   for (var r=0; r<ROWS; r++) {
    /* the slice sits across the full band but reads the bore a little inside it,
       so the outermost slice is not a near-empty chord glowing against the wall */
    var u=-1+2*(r+0.5)/ROWS, y=u*0.9;
    band(f.mix.map(function(m){ return bore(dye.k, m, y, streak(m.x, y, v, amp)) }),
         u*17, 34/ROWS+1.2);
   }
  } else band(f.steps&&f.steps.length?f.steps:[balanced(FIELD)], 0, 34);
  g.globalCompositeOperation='overlay'; g.globalAlpha=f.moving?0.16:0.07;
  g.drawImage(grain[k++%4],0,0,FRAME[0],FRAME[1]);
 }
 requestAnimationFrame(draw);
 return cv;
}

/* The band of the frame worth showing: the tube plus a margin either side. */
function crop(state) {
 var s=state||{}, fw=(s.frame&&s.frame[0])||FRAME[0], fh=(s.frame&&s.frame[1])||FRAME[1];
 var line=s.outline&&s.outline.length?s.outline:OUTLINE, lo=1e9, hi=-1e9;
 line.forEach(function(poly){ poly.forEach(function(q){ lo=Math.min(lo,q[1]); hi=Math.max(hi,q[1]) }) });
 var pad=Math.max(10,(hi-lo)*0.8), y0=Math.max(0,lo-pad);
 return { fw: fw, fh: fh, y0: y0, h: Math.min(fh,hi+pad)-y0 };
}

/* the camera's own view, scaled so the tube fills the card: both pages crop the same way */
function fit(feed, cam, state) {
 var box=feed.getBoundingClientRect();
 if (!box.width || !box.height) return;   /* a half-laid-out box crops to nonsense */
 var c=crop(state), fw=c.fw, fh=c.fh, y0=c.y0, h=c.h;
 var k=Math.max(box.width/fw, box.height/h);
 /* the frame always covers the card: an outline that would slide it off the top
    or bottom gets clamped, so a half-empty card is impossible whatever the mask says */
 var clamp=function(want, span, into){ return Math.min(0, Math.max(into-span, want)) };
 cam.style.width=(fw*k)+'px'; cam.style.height=(fh*k)+'px';
 cam.style.left=clamp((box.width-fw*k)/2, fw*k, box.width)+'px';
 cam.style.top=clamp(box.height/2-(y0+h/2)*k, fh*k, box.height)+'px';
}

/* the card settles after the first paint and grows as the run fills it, so the
   crop follows the box rather than being computed once and hoped over */
function follow(feed, cam, state) {
 var at = state || function () { return null };
 var again = function () { fit(feed, cam, at()) };
 again();
 if (typeof ResizeObserver !== 'undefined') new ResizeObserver(again).observe(feed);
 addEventListener('resize', again);
 return again;
}

/* The mask the rig carved, drawn over the feed in the frame's own coordinates. */
function overlay(ov, state) {
 var s=state||{}, c=crop(s);
 if (!s.outline || !s.outline.length) { ov.innerHTML=''; return }
 ov.setAttribute('viewBox', '0 ' + c.y0 + ' ' + c.fw + ' ' + c.h);
 ov.innerHTML = s.outline.map(function (poly) {
  return '<polygon points="' + poly.map(function (p) { return p[0] + ',' + p[1] }).join(' ') + '"/>';
 }).join('');
}

/* A camera that has stopped sending says so, rather than showing a stale frame. */
function watch(img, badge, onFrame) {
 var seen = 0;
 var mark = function (on) {
  badge.classList.toggle('down', !on);
  badge.lastChild.textContent = on ? 'Live' : 'No signal';
 };
 img.addEventListener('load', function () { seen = Date.now(); mark(true); if (onFrame) onFrame() });
 img.addEventListener('error', function () { mark(false) });
 setInterval(function () { if (seen && Date.now() - seen > 4000) mark(false) }, 1000);
 return mark;
}

return { frame: FRAME, outline: OUTLINE, field: balanced(FIELD), base: BASE, crop: crop, front: front, streak: streak,
         paint: paint, fit: fit, follow: follow, overlay: overlay, watch: watch };
})();
</script>
<script>

 var trust=Math.exp(-d2[0]/(TRUST*TRUST));
 var near=Math.min(1,(c[0]+c[1]+c[2])/0.05);
 return b.map(function(v,i){return clamp(v+(sw?near*trust*sr[i]/sw:0))});
}
function lab(rgb){
 function m(v){ return XYZ.map(function(r){return r[0]*v[0]+r[1]*v[1]+r[2]*v[2]}) }
 var ref=m(WHITE.map(light)), x=m(rgb.map(light)), D=6/29;
 var f=x.map(function(v,i){ var t=v/ref[i]; return t>D*D*D?Math.cbrt(t):t/(3*D*D)+4/29 });
 return [116*f[1]-16,500*(f[0]-f[1]),200*(f[1]-f[2])];
}

function absorb(c,i){ return c[0]*UVM.eps[0][i]+c[1]*UVM.eps[1][i]+c[2]*UVM.eps[2][i] }
function seen(a){ return UV_TOP*(1-Math.exp(-a/UV_TOP)) }
function uvSpectrum(c){
 return UVM.wl.map(function(w,i){ return round(Math.pow(10,-(seen(absorb(c,i))+0.003*gauss())),4) });
}
function uvChannels(c){
 return UV_CHAN.map(function(w){
  var i=UVM.wl.indexOf(w);
  return [w,round(Math.pow(10,-(seen(absorb(c,i))+0.005*gauss())),4)];
 });
}

var tube={old:[0,0,0],neu:[0,0,0],v0:5,q:0,qStop:0,t:0};
function volume(){
 var dt=clock()-tube.t;
 if(tube.q) return tube.v0+tube.q/60*(dt-RAMP_S*(1-Math.exp(-dt/RAMP_S)));
 /* the line does not stop dead -- it coasts as the pressure bleeds off */
 return tube.v0+tube.qStop/60*STOP_S*(1-Math.exp(-dt/STOP_S));
}
function at(x){
 var f=Tube.front(x,volume()).f;
 return tube.old.map(function(o,i){return o+f*(tube.neu[i]-o)});
}
function flow(r){
 var q=r.A+r.B+r.C+r.D;
 if(q>0){ tube.old=at(0.5); tube.neu=conc(r); tube.v0=0; tube.q=q; tube.t=clock(); }
 else if(tube.q){ tube.v0=volume(); tube.qStop=tube.q; tube.q=0; tube.t=clock(); }
}
function frameRGB(){
 var sd=tube.q?4:0.3;
 return colour(at(0.5)).map(function(v,i){ return clamp(v+sd*gauss())*WHITE[i]/TOP });
}
function shown(rgb){ return rgb.map(function(v,i){ return round(Math.min(255,Math.max(0,v/WHITE[i]*TOP)),1) }) }

var R={history:[],error:'',tripped:false,live:null,uv:null,uvLive:null,queue:Promise.resolve(),armed:null};
var T0=clock()-54.5;

async function go(label,r,secs){
 flow(r);
 var done=0;
 while(done<secs){
  var step=Math.min(secs-done,CHECK_S);
  await sleep(step); done+=step;
  if(R.halt){ R.halt=false; flow({A:0,B:0,C:0,D:0}); throw fail('Stopped',label+': stopped by hand') }
  if(R.armed && tube.q>0){ var a=R.armed; R.armed=null; flow({A:0,B:0,C:0,D:0}); throw fail('Tripped',label+': '+a); }
 }
}
async function measure(secs){
 /* every frame across the window, taken while the fluid is still moving */
 var seen=[], n=Math.max(1,Math.round(secs*FPS));
 for(var i=0;i<n;i++){ await sleep(1/FPS); seen.push(frameRGB()) }
 return [0,1,2].map(function(j){
  var col=seen.map(function(f){return f[j]}).sort(function(a,b){return a-b});
  return col[col.length>>1];                       // the middle of the window
 });
}
function shot(label,r,hue,strength,rgb){
 return {n:R.history.length+1,hue:hue,strength:strength,
  rates:{A:round(r.A,3),B:round(r.B,3),C:round(r.C,3),D:round(r.D,3)},
  rgb:rgb.map(function(v){return round(v,2)}),disp:shown(rgb),
  lab:lab(rgb).map(function(v){return round(v,2)}),at_s:round(clock()-T0,1)};
}
function run(label,r,hue,strength){
 if(R.tripped) return Promise.reject(fail('Tripped','session is tripped; restart the mixer'));
 var job=R.queue.then(async function(){
  R.error='';
  var eye=setInterval(function(){ R.live=shown(frameRGB()); R.uvLive=uvChannels(at(0.5)) },1000*LIVE_S/SPEED);
  try{
   var push=Math.max(0,60*V_PUSH/Q_RUN-WINDOW_S/2);
   began('dispensing',push);
   await go(label+' push',r,push);
   began('measuring',WINDOW_S);
   var both=await Promise.all([measure(WINDOW_S), go(label+' read',r,WINDOW_S)]);
   flow({A:0,B:0,C:0,D:0});                       // idle between mixes
   var s=shot(label,r,hue,strength,both[0]);
   R.uv={wl:UVM.wl,t:uvSpectrum(at(0.5))};
  }catch(e){
   R.tripped=e.name==='Tripped'; R.error=R.tripped?e.message:e.name+': '+e.message; throw e;
  }finally{ clearInterval(eye); flow({A:0,B:0,C:0,D:0}); R.live=null; R.uvLive=null; began('',0); }
  R.history.push(s); return s;
 });
 R.queue=job.catch(function(){}); return job;
}
function began(what,secs){ R.step=what; R.stepS=secs; R.stepAt=Date.now() }
function state(){
 return {error:R.error,tripped:R.tripped,live:R.live,mask_pixels:MASK_PIXELS,outline:Tube.outline,frame:Tube.frame,
  step:R.step||'',step_s:R.stepS||0,
  step_for:R.step?Math.round((Date.now()-R.stepAt)/100)/10*SPEED:0,warming:'',
  history:R.history.slice(-60),q_run:Q_RUN,pump_min:PUMP_MIN,uv:R.uv,uv_live:R.uvLive,
  uv_source:'simulated'};
}
R.history.push(shot('blank',rinse(),[0,0,0],0,frameRGB()));
R.uv={wl:UVM.wl,t:uvSpectrum(at(0.5))};

function reply(o,code){
 return new Response(JSON.stringify(o),{status:code||200,headers:{'Content-Type':'application/json'}});
}
var net=window.fetch;
window.fetch=async function(url,opts){
 var path=new URL(String(url),'http://mixer').pathname, method=(opts&&opts.method)||'GET';
 if(method==='GET'){
  if(path==='/state') return reply(state());
  if(path==='/wheel') return reply(WHEEL);
  if(path==='/model') return reply(UVM);
  return net.apply(this,arguments);
 }
 var body=JSON.parse((opts&&opts.body)||'{}');
 try{
  if(path==='/dispense'){
   var hue=['a','b','c'].map(function(k){return +body[k]}), t=sum(hue)||1;
   var unit=hue.map(function(v){return v/t}), strength=+body.strength;
   var r=rates(unit,strength), why=feasible(r);
   if(why) return reply({error:why},400);
   var label='mix'+String(R.history.length+1).padStart(3,'0');
   return reply(await run(label,r,unit,strength));
  }
  if(path==='/stop'){ R.halt=true; flow({A:0,B:0,C:0,D:0}); began('',0); return reply({ok:true}) }
  if(path==='/blank') return reply(await run('blank',rinse(),[0,0,0],0));
  return reply({},404);
 }catch(e){ return reply({error:e.name+': '+e.message},500); }
};

/* The page reads its state off a socket, so the simulator answers one -- the
   same move as the fetch override above, and for the same reason: the page keeps
   a single code path whether or not a rig is behind it. The rig pushes when
   something changes and coalesces at PUSH_S; here a PUSH_S timer is the same
   thing seen from the page, and idle traffic costs nothing offline. */
window.WebSocket=function(){
 var me=this, beat=0;
 me.readyState=1;
 setTimeout(function(){
  var send=function(){ if(me.onmessage) me.onmessage({data:JSON.stringify(state())}) };
  send();                       // bootstrap, as the rig's first message is
  beat=setInterval(send,300);
 },0);
 me.close=function(){ clearInterval(beat); me.readyState=3; if(me.onclose) me.onclose({}) };
};

/* the tube is drawn by the shared renderer, so both demos show the same tube */
var STOPS=64;
Tube.paint(document.getElementById('cam'), function(){
 var v=volume(), mix=[];
 for(var i=0;i<=STOPS;i++) mix.push(Tube.front(i/STOPS,v));
 return {old:colour(tube.old), neu:colour(tube.neu), mix:mix, v:v, moving:tube.q>0};
});

window.sim={trip:function(alert){ R.armed=alert||'SYS_OVERPRESSURE_TRIP' },state:state,colour:colour,conc:conc,rates:rates,lab:lab};
console.info('mixer offline: ?speed=N runs the rig N times faster; sim.trip() trips the next push');
})();
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S={q_run:8.0}, W=null, UV=null, busy=false, sel=-1, sent=null, stale=true;
var made=null;  // flows of the last dispense; the spectrum panel holds still on these
var warming='';  // what the rig is doing before it will take a mix
var DYES=[{name:'Yellow',c:'var(--yellow)'},{name:'Red',c:'var(--red)'},{name:'Blue',c:'var(--dblue)'},{name:'Water',c:'var(--water)'}];
var NS='http://www.w3.org/2000/svg';

var X1=33, X2=66;
function parts(){ return [X1/100,(X2-X1)/100,(100-X2)/100] }
function setSplit(u){
 var t=u[0]+u[1]+u[2]||1;
 X1=100*u[0]/t; X2=100*(u[0]+u[1])/t;
 X1=Math.max(0,Math.min(100,X1)); X2=Math.max(X1,Math.min(100,X2));
}
function strength(){ return +$('s').value/100 }
function flows(u,s){
 var r=u.map(function(w){return w*s*S.q_run});
 r.push(S.q_run-r[0]-r[1]-r[2]); return r;
}

function el(tag,attrs,parent){
 var e=document.createElementNS(NS,tag);
 for(var k in attrs) e.setAttribute(k,attrs[k]);
 if(parent) parent.appendChild(e); return e;
}
var B=[];
function drawBottles(){
 var svg=$('bottles'), box=svg.getBoundingClientRect();
 var H=Math.max(300,Math.round(400*box.height/(box.width||1))), top=44, j=H-40, body='M21 22v3C7 29 4 37 4 47v48q0 10 10 10h28q10 0 10-10V47c0-10-3-18-17-22v-3z';
 svg.setAttribute('viewBox','0 0 400 '+H); svg.innerHTML=''; B=[];
 var defs=el('defs',{},svg);
 /* the tubes start inside the bottles and are cut at their feet, so each one
    leaves its bottle with no floating end -- an idle bottle is translucent and
    would otherwise show the line straight through it */
 el('clipPath',{id:'belowbt'},defs).appendChild(el('rect',{x:0,y:top+146,width:400,height:H}));
 var tubes=el('g',{'clip-path':'url(#belowbt)'},svg);
 DYES.forEach(function(d,i){
  var cx=50+100*i, y0=top+132, bend=y0+(j-y0)*0.55;
  var feed='M'+cx+' '+y0+'C'+cx+' '+bend+' 200 '+(bend-10)+' 200 '+j;
  B.push({line:el('path',{class:'feed',d:feed,stroke:d.c},tubes),flow:el('path',{class:'flow',d:feed},tubes)});
 });
 B.out=el('path',{class:'feed mixed',d:'M200 '+j+'V'+H,stroke:'var(--rule)','stroke-width':16},tubes);
 B.dot=el('circle',{class:'mixed',cx:200,cy:j,r:13,fill:'var(--surface)',stroke:'var(--rule)','stroke-width':3},tubes);
 DYES.forEach(function(d,i){
  var cx=50+100*i;
  el('clipPath',{id:'bt'+i},defs).appendChild(el('path',{d:body}));
  var g=el('g',{class:'bottle'},svg), bob=el('g',{class:'bob',style:'animation-delay:'+(-0.27*i)+'s'},g);
  el('text',{x:cx,y:top-14},bob).textContent=d.name;
  var inner=el('g',{transform:'translate('+(cx-39)+' '+top+') scale(1.4)'},bob);
  el('path',{class:'glass',d:body},inner);
  var liq=el('g',{'clip-path':'url(#bt'+i+')'},inner);
  var wave='M0 44q7-4 14 0t14 0 14 0 14 0';
  el('rect',{x:0,y:54,width:56,height:60,fill:d.c},liq);
  el('path',{d:wave+'v14H0z',fill:d.c},liq);            // the surface, overlapping the body
  el('path',{d:wave,fill:'none',stroke:'rgba(0,0,0,.20)',
             'stroke-width':1.4,'stroke-linecap':'round'},liq);
  el('path',{d:'M0 46.5q7-4 14 0t14 0 14 0 14 0',fill:'none',stroke:'rgba(255,255,255,.35)',
             'stroke-width':1},liq);
  el('path',{class:'rim',d:body},inner);
  el('rect',{class:'shine',x:10,y:40,width:5,height:52,rx:2.5},inner);
  el('rect',{class:'glass',x:21,y:14,width:14,height:8},inner);
  el('rect',{class:'cap',x:17,y:0,width:22,height:14,rx:3},inner);   // the cap sits on top
  B[i].g=g;
 });
 if(last) mixColour(last);
}
var last=null;
function paintBottles(){
 var r=busy&&sent?sent:flows(parts(),strength());
 r.forEach(function(v,i){
  var f=v/S.q_run, idle=!(v>0);
  B[i].line.style.strokeWidth=(3+26*f)+'px';
  B[i].flow.style.strokeWidth=Math.max(1.5,(3+26*f)*0.35)+'px';
  B[i].g.classList.toggle('idle',idle);
  B[i].flow.style.visibility=idle?'hidden':'';
  B[i].line.style.opacity=idle?0.35:1;
 });
}
function mixColour(c){
 last=c;
 B.out.setAttribute('stroke',c||'var(--rule)');
 B.dot.setAttribute('fill',c||'var(--surface)');
}

function paint(){
 var s=strength(), w=[X1,X2-X1,100-X2], shown=w.map(Math.round);
 [['segA',0,0],['segB',X1,1],['segC',X2,2]].forEach(function(d){
  var e=$(d[0]); e.style.left=d[1]+'%'; e.style.width=w[d[2]]+'%';
  e.classList.toggle('thin', w[d[2]]<11);
  e.firstElementChild.textContent=shown[d[2]]+'%';
 });
 $('g1').style.left=X1+'%'; $('g2').style.left=X2+'%';
 ['g1','g2'].forEach(function(g,i){
  var e=$(g); e.setAttribute('aria-valuenow',Math.round(i?X2:X1));
  e.setAttribute('aria-valuetext',
   (i?shown[1]+'% red, '+shown[2]+'% blue':shown[0]+'% yellow, '+shown[1]+'% red')); });
 $('sv').textContent=Math.round(s*100)+'%';
 drawTarget();
 paintBottles();
 drawSpec();
}
function mark(i){
 sel=i; Wheel.mark($('wheel'), W&&W.cells, i);
}
function load(u,s,i){
 setSplit(u); $('s').value=(100*s).toFixed(1);
 stale=true; paint(); mark(i===undefined?-1:i);
}
$('s').addEventListener('input',function(){ stale=true; paint(); mark(-1); });

function pct(e){
 var r=$('mix').getBoundingClientRect();
 return Math.max(0,Math.min(100,Math.round(100*(e.clientX-r.left)/r.width)));
}
['g1','g2'].forEach(function(id,i){
 var e=$(id);
 e.addEventListener('pointerdown',function(ev){ e.setPointerCapture(ev.pointerId); ev.preventDefault(); });
 e.addEventListener('pointermove',function(ev){
  if(!e.hasPointerCapture(ev.pointerId)) return;
  var v=pct(ev);
  if(i===0) X1=Math.min(v,X2); else X2=Math.max(v,X1);
  stale=true; paint(); mark(-1);
 });
 e.addEventListener('keydown',function(ev){
  var d={ArrowLeft:-1,ArrowRight:1,PageDown:-10,PageUp:10}[ev.key];
  if(d===undefined) return;
  ev.preventDefault();
  if(i===0) X1=Math.max(0,Math.min(X2,X1+d)); else X2=Math.max(X1,Math.min(100,X2+d));
  stale=true; paint(); mark(-1);
 });
});

var rgb=Coast.rgb, hex=Coast.hex;

function targetRGB(){
 var q=flows(parts(),strength());
 /* the simulator carries the fitted colour model, which is good anywhere */
 if(window.sim&&sim.colour&&sim.conc) return sim.colour(sim.conc({A:q[0],B:q[1],C:q[2],D:q[3]}));
 /* otherwise read it off the wheel's own measured colours: exact at a cell,
    smooth between the nearest few, and saturating rather than extrapolating */
 if(!W||!W.cells||!W.cells.length) return null;
 var c=[q[0]/S.q_run,q[1]/S.q_run,q[2]/S.q_run], near=[];
 function add(cc,v){
  var d2=0; for(var k=0;k<3;k++){ var d=cc[k]-c[k]; d2+=d*d }
  near.push([d2,v]);
 }
 add([0,0,0],[255,255,255]);   // no dye is solvent, which reads white
 W.cells.forEach(function(k){
  var a=k.answer; add([a[0]/S.q_run,a[1]/S.q_run,a[2]/S.q_run],k.rgb);
 });
 near.sort(function(a,b){return a[0]-b[0]});
 var sw=0, sr=[0,0,0];
 near.slice(0,4).forEach(function(t){
  var g=1/(Math.pow(t[0],1.5)+1e-12);
  sw+=g; for(var k=0;k<3;k++) sr[k]+=g*t[1][k];
 });
 return sw>0?sr.map(function(v){return v/sw}):null;
}
function drawTarget(){
 var v=targetRGB();
 $('halfT').style.backgroundColor=v?rgb(v):'var(--bg)';
 $('hexT').textContent=v?hex(v):'\u2014';
}
function recipe(c){
 /* the cell's own pump setting, as the hue split and strength the sliders hold */
 var q=c.answer, t=q[0]+q[1]+q[2];
 return {u:q.map(function(v){return t>1e-9?v/t:1/3}), s:t/S.q_run};
}
function drawWheel(){
 Wheel.draw($('wheel'), W.cells);
 var ring=Wheel.ringCss(W.cells);
 if(ring) document.documentElement.style.setProperty('--ring',ring);
 mark(sel);
}
$('wheel').addEventListener('click',function(e){
 var p=e.target.closest('path.cell'); if(!p||!W) return;
 var i=+p.dataset.i, r=recipe(W.cells[i]); load(r.u,r.s,i);
});

var go=$('go');
go.addEventListener('pointermove',function(e){
 var r=go.getBoundingClientRect();
 go.style.setProperty('--mx',(e.clientX-r.left)+'px'); go.style.setProperty('--my',(e.clientY-r.top)+'px');
});

function byHand(why){ return /stopped by hand|^Stopped:/i.test(why||'') }
function saidWrong(why){
 /* a stop the operator asked for is not a fault; only real trouble is printed */
 $('err').textContent=byHand(why)?'':(why||'');
 $('st').className='chip'+(byHand(why)?'':' bad');
 $('st').textContent=byHand(why)?'stopped':'error';
}
function setBusy(on,what){
 busy=on; go.disabled=on||!!warming; $('blank').disabled=on||!!warming;
 $('halt').disabled=!on;
 $('recipe').classList.toggle('running',on);
 $('st').className='chip'+(on?' busy':''); $('st').textContent=on?(what||'running'):'ready';
 /* until the rig names its step, the button says what was asked of it */
 $('golabel').textContent=on?(what==='rinsing'?'Rinsing\u2026':'Mixing\u2026'):'Make color';
 if(!on) $('fill').style.width='0';
 paintBottles();
}
function show(v){
 $('halfM').style.backgroundColor=rgb(v);
 $('hexv').textContent=hex(v);
 mixColour(rgb(v));
}

async function post(path,body){
 sent=path==='/blank'?[0,0,0,S.q_run]:flows(parts(),strength());
 setBusy(true, path==='/blank'?'rinsing':'making color'); $('err').textContent='';
 try{
  var out=await (await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
                                   body:JSON.stringify(body||{})})).json();
  var why=out.error||out.detail;
  if(why){ setBusy(false); saidWrong(why); }
  else { stale=path==='/blank'; show(out.disp); setBusy(false); }
 }catch(e){ setBusy(false); saidWrong(String(e)); }
}
go.addEventListener('click',function(){
 var u=parts(); post('/dispense',{a:u[0],b:u[1],c:u[2],strength:strength()});
});
$('blank').addEventListener('click',function(){ post('/blank') });

/* the rig pushes its state over the socket whenever anything moves -- every
   step, every live reading, every shot -- so there is nothing to poll for */
function apply(s){
  S=s; Tube.overlay($('ov'),s); fitCam();
  var last=s.history[s.history.length-1];
  made=last?[last.rates.A,last.rates.B,last.rates.C]:null;
  warming=s.warming||'';
  if(warming&&!busy){ $('st').className='chip busy'; $('st').textContent=warming;
   go.disabled=$('blank').disabled=$('halt').disabled=true;
   $('golabel').textContent='Starting\u2026'; }
  else if(!busy&&$('golabel').textContent==='Starting\u2026') setBusy(false);
   drawBar(s);
  if(s.live) show(s.live);
  else if(s.history.length) show(s.history[s.history.length-1].disp);
  if(s.tripped){ saidWrong(s.error); $('st').className='chip bad'; $('st').textContent='tripped'; }
  paint();
}
function connect(){
 var ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');
 ws.onmessage=function(e){ apply(JSON.parse(e.data)) };
 ws.onclose=function(){ setTimeout(connect,1500) };   // mirrors the stream's retry
 ws.onerror=function(){ ws.close() };
}

function wlrgb(w){
 var r=0,g=0,b=0;
 if(w<440){ r=-(w-440)/60; b=1 } else if(w<490){ g=(w-440)/50; b=1 }
 else if(w<510){ g=1; b=-(w-510)/20 } else if(w<580){ r=(w-510)/70; g=1 }
 else if(w<645){ r=1; g=-(w-645)/65 } else { r=1 }
 var f=w<420?0.3+0.7*(w-380)/40:w>700?0.3+0.7*(780-w)/80:1;
 return 'rgb('+[r,g,b].map(function(x){return Math.round(255*Math.pow(Math.max(0,x)*f,0.8))}).join(',')+')';
}
function predict(){
 if(!UV||!made) return null;
 return UV.wl.map(function(w,i){
  var a=made[0]/S.q_run*UV.eps[0][i]+made[1]/S.q_run*UV.eps[1][i]+made[2]/S.q_run*UV.eps[2][i];
  return Math.pow(10,-a);
 });
}
var revealAt=0, REVEAL_MS=750, revealing=false, lastTrace='';
function openReveal(host,full){
 /* the trace is clipped by a rect that opens across the plot when a reading lands */
 var r=host.querySelector('#revrect'); if(!r) return;
 r.dataset.full=full;
 var f=revealAt?Math.min(1,(performance.now()-revealAt)/REVEAL_MS):1;
 r.setAttribute('width',(full*f).toFixed(1));
 if(f<1 && !revealing){ revealing=true; requestAnimationFrame(stepReveal) }
}
function stepReveal(){
 var r=$('plot').querySelector('#revrect');
 if(!r){ revealing=false; return }
 var f=Math.min(1,(performance.now()-revealAt)/REVEAL_MS);
 r.setAttribute('width',(+r.dataset.full*f).toFixed(1));
 if(f<1) requestAnimationFrame(stepReveal); else revealing=false;
}
function drawSpec(){
 if(revealing) return;   // the sweep owns the plot until it lands
 var host=$('plot'), box=host.getBoundingClientRect(); if(!box.width||!box.height) return;
 var W2=Math.round(box.width), H=Math.round(box.height);
 var fs=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
 var L=3.4*fs+14, R=12, T=0.8*fs, B=3.4*fs, x0=400, x1=660;
 var X=function(w){return L+(W2-L-R)*(w-x0)/(x1-x0)}, Y=function(t){return T+(H-T-B)*(1-Math.max(0,Math.min(1,t)))};
 var wl=UV?UV.wl:[x0,x1], pred=predict();
 var got=made&&S.uv&&S.uv.t&&S.uv.t.length===wl.length?S.uv.t:null;
 var trace=got?got.length+':'+got[0]+':'+got[got.length>>1]:'';
 if(trace&&trace!==lastTrace&&!$('spec').classList.contains('busy')){
  lastTrace=trace; revealAt=performance.now();
 }
 var keep=[]; wl.forEach(function(w,i){ if(w>=x0&&w<=x1) keep.push(i) });
 function line(v){ return 'M'+keep.map(function(i){return X(wl[i]).toFixed(1)+','+Y(v[i]).toFixed(1)}).join('L') }
 var o='<svg viewBox="0 0 '+W2+' '+H+'" width="100%" height="100%" style="display:block">';
 o+='<defs><linearGradient id="vis">';
 for(var w=x0;w<=x1;w+=10) o+='<stop offset="'+((w-x0)/(x1-x0)).toFixed(3)+'" stop-color="'+wlrgb(w)+'"/>';
 o+='</linearGradient>';
 o+='<clipPath id="rev"><rect id="revrect" x="'+L.toFixed(1)+'" y="0" width="0" height="'+H+'"/></clipPath>';
 o+='</defs><g class="data" clip-path="url(#rev)">';
 var fill=got||pred;
 if(fill) o+='<path d="'+line(fill)+'L'+X(x1)+','+Y(0)+'L'+X(x0)+','+Y(0)+'Z" fill="url(#vis)" fill-opacity="'+(got?1:0.4)+'"/>';
 if(got) o+='<path d="'+line(got)+'" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>';
 o+='</g>';
 o+='<line x1="'+L+'" x2="'+(W2-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--ink2)" stroke-width="1.2"/>';
 [0,50,100].forEach(function(t){ o+='<text x="'+(L-0.6*fs).toFixed(1)+'" y="'+(Y(t/100)+0.34*fs).toFixed(1)+'" text-anchor="end">'+t+'</text>' });
 [400,450,500,550,600,650].forEach(function(w){ o+='<text x="'+X(w).toFixed(1)+'" y="'+(H-B+1.5*fs).toFixed(1)+'" text-anchor="middle">'+w+'</text>' });
 var mid=((T+H-B)/2).toFixed(1), ax=(0.95*fs).toFixed(1);
 o+='<text class="ax yax" x="'+ax+'" y="'+mid+'" transform="rotate(-90 '+ax+' '+mid+')" text-anchor="middle">TRANSMITTANCE (%)</text>';
 o+='<text class="ax" x="'+((L+W2-R)/2).toFixed(1)+'" y="'+(H-0.35*fs).toFixed(1)+'" text-anchor="middle">WAVELENGTH (nm)</text>';
 host.innerHTML=o+'</svg>';
 openReveal(host, W2-L-R);
 /* the rotated label is bounded by the plot's height, not by hope */
 var yax=host.querySelector('text.yax'), room=(H-T-B)-0.5*fs;
 if(yax && room>0 && yax.getComputedTextLength()>room){
  yax.setAttribute('textLength',room.toFixed(1));
  yax.setAttribute('lengthAdjust','spacingAndGlyphs');
 }
}
/* ---- settings ---- */
var root=document.documentElement;
var OPT={theme:'light',mask:false,turn:false};
try{ var saved=JSON.parse(localStorage.getItem('mixer-opts')||'{}');
 for(var k in OPT) if(k in saved) OPT[k]=saved[k]; }catch(e){}
function applyOpts(){
 if(OPT.theme==='auto') delete root.dataset.theme; else root.dataset.theme=OPT.theme;
 $('ov').toggleAttribute('hidden',!OPT.mask);   /* svg has no .hidden */
 document.querySelector('.feed .turn').classList.toggle('flip',OPT.turn);
 $('opt-theme').value=OPT.theme; $('opt-mask').checked=OPT.mask;
 $('opt-turn').checked=OPT.turn;
 try{ localStorage.setItem('mixer-opts',JSON.stringify(OPT));
      localStorage.setItem('mixer-theme',OPT.theme) }catch(e){}
 if(window.S) paint();
}
var openPanel=Coast.panel($('theme'),$('panel'));
$('halt').addEventListener('click',async function(){
 $('halt').disabled=true;
 try{ await fetch('/stop',{method:'POST'}) }catch(e){}
 $('err').textContent='';
 setBusy(false);
 $('st').className='chip'; $('st').textContent='stopped';
});
$('opt-theme').addEventListener('change',function(){ OPT.theme=this.value; applyOpts() });
['mask','turn'].forEach(function(k){
 $('opt-'+k).addEventListener('change',function(){ OPT[k]=this.checked; applyOpts() });
});
applyOpts();

var fitCam=Tube.follow($('feed'),$('cam'),function(){ return S });

/* ---- what the rig is doing ---- */
var setStep=Coast.progress($('go'),$('fill'),$('golabel'),'Make color');
function drawBar(s){
 var was=$('spec').classList.contains('busy');
 setStep(s.step,s.step_s,s.step_for);
 var on=s.step==='measuring';   // only the read blanks the spectrum
 $('spec').classList.toggle('busy',on);
 if(was&&!on) drawSpec();   // the reading is in; let it sweep across
}

var img=$('cam');
function stream(){ img.src='/stream?n='+Date.now(); }
Tube.watch(img,$('live'));
img.addEventListener('error',function(){ setTimeout(stream,1500) });
stream();

drawBottles(); paint();
new ResizeObserver(function(){ drawBottles(); paintBottles(); }).observe($('bottles'));
new ResizeObserver(drawSpec).observe($('feed'));
new ResizeObserver(drawSpec).observe($('plot'));
fetch('/wheel').then(function(r){return r.json()}).then(function(d){ W=d; drawWheel(); }).catch(function(){});
fetch('/model').then(function(r){return r.json()}).then(function(d){ UV=d; drawSpec(); }).catch(function(){});
connect();
})();
</script>
