<!doctype html>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COAST PCL Color Mixer</title>
<style>
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
 --bg:#f3f6f9;--surface:#fff;--rule:#dce3ea;--ink:#0b2540;--ink2:#435568;--muted:#738396;
 --navy:#003660;--blue:#2774ae;--gold:#f7b629;--glass:#f6f9fc;--bad:#c42b3f;
 --yellow:#f2c418;--red:#d3223a;--dblue:#1f6fd8;--water:#cfe6f5;
 --ring:#ff4d5e,#ffa31a,#ffe03a,#3fd07f,#27b6f0,#5b6bff,#d44fd6,#ff4d5e;
 --sans:"Avenir Next","Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 font-size:clamp(15px,1.85vmin,24px)}
:root[data-theme=dark]{
 --bg:#0a1521;--surface:#112233;--rule:#223a50;--ink:#eef3f8;--ink2:#b1c0ce;--muted:#8093a6;
 --navy:#1d4a78;--glass:#1a2e42;--water:#6f93ad;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0a1521;--surface:#112233;--rule:#223a50;--ink:#eef3f8;--ink2:#b1c0ce;--muted:#8093a6;
 --navy:#1d4a78;--glass:#1a2e42;--water:#6f93ad;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.35 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1rem;padding:1rem 1.2rem 1.2rem}
header{display:flex;align-items:center;gap:1rem}
header .logo{height:3.4rem;width:auto;display:block}
header .logo.d,:root[data-theme=dark] header .logo.l{display:none}
:root[data-theme=dark] header .logo.d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) header .logo.l{display:none}:root:not([data-theme=light]) header .logo.d{display:block}}
.theme{padding:0;width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.theme:hover{color:var(--ink);background:var(--surface)}
.theme:focus-visible{outline:3px solid var(--blue)}
.theme svg{width:1.25rem;height:1.25rem}
.theme .sun,:root[data-theme=dark] .theme .moon{display:none}
:root[data-theme=dark] .theme .sun{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .theme .moon{display:none}:root:not([data-theme=light]) .theme .sun{display:block}}
h1{font-size:2.3rem;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1 span{color:var(--blue)}
header .grow{flex:1}
.chip{font:700 .85rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
 padding:.6em 1em;border:2px solid var(--rule);border-radius:99px;color:var(--ink2);white-space:nowrap}
.chip.busy{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:1rem;min-height:0}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:1rem;padding:1rem 1.2rem;
 display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--gold))}
h2{font:700 .95rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
 margin:.2rem 0 .8rem;display:flex;align-items:center;gap:1rem}
h2 .where{margin-left:auto;display:flex;align-items:center;gap:.35em;text-transform:none;letter-spacing:0;font:600 1.05rem/1 var(--sans);color:var(--ink2)}
h2 .where svg{width:1.2em;height:1.2em;fill:var(--blue)}

.pick{flex:1}
#wheel{flex:1;min-height:0;width:100%;height:100%;display:block}
path.cell{cursor:pointer}
path.cell:hover{stroke:var(--ink);stroke-width:1.8}
path.on{stroke:var(--ink);stroke-width:3}

.recipe{flex:1;justify-content:space-between;gap:.6rem}
#bottles{width:100%;flex:1;min-height:0;display:block}
#bottles text{font:700 21px var(--sans);fill:var(--ink2);text-anchor:middle}
#bottles .glass{fill:var(--glass);stroke:var(--ink2);stroke-width:1.6}
#bottles .rim{fill:none;stroke:var(--ink2);stroke-width:1.6}
#bottles .cap{fill:var(--navy)}
#bottles .shine{fill:#fff;opacity:.45}
#bottles .bottle{transition:opacity .25s}
#bottles .bottle.idle{opacity:.38}
#bottles .feed{fill:none;stroke-linecap:round;transition:stroke-width .25s}
#bottles .flow{fill:none;stroke-linecap:round;stroke:#fff;stroke-opacity:.55;stroke-dasharray:3 14;opacity:0}
.running #bottles .flow{opacity:1;animation:run .6s linear infinite}
@keyframes run{to{stroke-dashoffset:-17}}
#bottles .mixed{transition:fill .4s,stroke .4s}
.running #bottles .bob{animation:bob 1.1s ease-in-out infinite}
.running #bottles .idle .bob{animation:none}
@keyframes bob{50%{transform:translateY(-3px)}}

.mix{position:relative;height:3.4rem;border-radius:.8rem;overflow:hidden;background:var(--bg);
 border:1px solid var(--rule);touch-action:none;user-select:none;flex:none}
.seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
 font:700 1.3rem/1 var(--mono);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.seg.light{color:#2b2200;text-shadow:none}
.seg span{transition:opacity .12s}
.seg.thin span{opacity:0}
.grip{position:absolute;top:-1px;bottom:-1px;width:1.1rem;margin-left:-.55rem;cursor:ew-resize;
 background:var(--surface);border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.grip::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:1.4rem;margin:-.7rem 0 0 -2px;border-radius:2px;background:var(--muted)}
.grip:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.strength{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l v" "s s";align-items:center;column-gap:1rem;flex:none}
.strength b{grid-area:l}.strength .v{grid-area:v}.strength input{grid-area:s}
.strength b{font-size:1.3rem;font-weight:700}
.strength .v{font:700 1.4rem/1 var(--mono);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2.2rem;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:.7rem;border-radius:99px;background:linear-gradient(90deg,var(--water),var(--navy))}
input[type=range]::-moz-range-track{height:.7rem;border-radius:99px;background:linear-gradient(90deg,var(--water),var(--navy))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:1.8rem;height:1.8rem;margin-top:-.55rem;border-radius:50%;background:var(--surface);border:4px solid var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:1.3rem;height:1.3rem;border-radius:50%;background:var(--surface);border:4px solid var(--navy)}
input[type=range]:focus-visible{outline:3px solid var(--blue);outline-offset:4px;border-radius:99px}

.go{display:flex;gap:1rem;align-items:stretch;flex:none;padding:6px 6px 2px}
button{font:700 1.3rem/1 var(--sans);padding:1rem 1.4rem;border-radius:1rem;border:2px solid var(--rule);
 background:var(--surface);color:var(--ink);cursor:pointer}
button:disabled{cursor:default}
#blank:disabled{opacity:.45}
.make{flex:1;white-space:nowrap;position:relative;isolation:isolate;border:0;color:#fff;font-size:1.6rem;letter-spacing:.01em;
 background:transparent;--mx:50%;--my:50%;transition:transform .15s}
.make::before,.make::after{content:"";position:absolute;inset:-5px;border-radius:1.3rem;z-index:-2;
 background:conic-gradient(from var(--spin),var(--ring));animation:spin 5s linear infinite}
.make::after{z-index:-3;filter:blur(14px);opacity:.35;transition:opacity .2s}
.make span{position:relative;z-index:1}
.make b{position:absolute;inset:0;border-radius:1rem;z-index:-1;background:var(--navy)}
.make i{position:absolute;inset:0;border-radius:1rem;z-index:0;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.28),transparent 55%);opacity:0;transition:opacity .2s}
.make:hover:not(:disabled){transform:translateY(-2px)}
.make:hover:not(:disabled)::before,.make:hover:not(:disabled)::after{animation-duration:1.6s}
.make:hover:not(:disabled)::after{opacity:.75}
.make:hover:not(:disabled) i{opacity:1}
.make:active:not(:disabled){transform:translateY(1px)}
.make:disabled::before,.make:disabled::after{animation-duration:.7s}
.make:disabled::after{opacity:.9}
@keyframes spin{to{--spin:360deg}}
.err{color:var(--bad);font:600 1.05rem/1.35 var(--mono);min-height:0;flex:none}
.err:empty{display:none}

.tube{flex:1.8}
.feed{position:relative;flex:1;min-height:0;border-radius:.7rem;overflow:hidden;background:#000}
.feed .turn{position:absolute;inset:0;transition:transform .2s}
.live{position:absolute;top:.7rem;left:.7rem;display:flex;align-items:center;gap:.45em;padding:.4em .75em;border-radius:.5rem;
 background:rgba(0,0,0,.58);color:#fff;font:700 .85rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.live i{width:.6rem;height:.6rem;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 0 rgba(255,59,59,.7);animation:pulse 1.6s ease-out infinite}
.live.down i{background:#9aa5b1;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 .5rem rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.feed img{width:100%;height:100%;object-fit:cover;display:block}
.feed svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed svg.ov polygon{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.7);stroke-width:1.5;vector-effect:non-scaling-stroke}
.meas{flex:1}
.patch{flex:1;min-height:0;border-radius:.7rem;border:1px solid var(--rule);background:var(--bg);transition:background-color .35s}
.vals{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-top:.8rem;flex-wrap:wrap}
.vals .n{font:700 2rem/1.1 var(--mono);letter-spacing:-.02em}
.vals .h{font:700 1.3rem/1.2 var(--mono);color:var(--ink2)}
.vals .h em{font:700 .8rem/1 var(--sans);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-left:.6em}

@media (max-width:1180px){.make{font-size:1.3rem}.go button{padding:.9rem 1rem}}
@media (max-width:900px),(max-aspect-ratio:1/1){
 body{overflow:auto}
 .app{height:auto}
 main{grid-template-columns:1fr}
 .pick #wheel{height:auto;aspect-ratio:1}
 .feed{height:14rem;flex:none}
 .patch{height:12rem;flex:none}
 .col .card{flex:none}
 #bottles{flex:none;height:22rem}
}
</style>

function mixColour(c){
 last=c;
 B.out.setAttribute('stroke',c||'var(--rule)');
 B.dot.setAttribute('fill',c||'var(--surface)');
}

function paint(){
 var s=strength(), w=[X1,X2-X1,100-X2];
 [['segA',0,0],['segB',X1,1],['segC',X2,2]].forEach(function(d){
  var e=$(d[0]); e.style.left=d[1]+'%'; e.style.width=w[d[2]]+'%';
  e.classList.toggle('thin', w[d[2]]<11);
  e.firstElementChild.textContent=w[d[2]]+'%';
 });
 $('g1').style.left=X1+'%'; $('g2').style.left=X2+'%';
 ['g1','g2'].forEach(function(g,i){
  var e=$(g); e.setAttribute('aria-valuenow',i?X2:X1); e.setAttribute('aria-valuetext',
   (i?w[1]+'% red, '+w[2]+'% blue':w[0]+'% yellow, '+w[1]+'% red')); });
 $('sv').textContent=Math.round(s*100)+'%';
 paintBottles();
}
function mark(i){
 sel=i;
 var ps=$('wheel').querySelectorAll('path.cell');
 for(var j=0;j<ps.length;j++) ps[j].classList.toggle('on', j===i);
}
function load(u,s,i){
 setSplit(u); $('s').value=Math.round(100*s);
 paint(); mark(i===undefined?-1:i);
}
$('s').addEventListener('input',function(){ paint(); mark(-1); });

function pct(e){
 var r=$('mix').getBoundingClientRect();
 return Math.max(0,Math.min(100,Math.round(100*(e.clientX-r.left)/r.width)));
}
['g1','g2'].forEach(function(id,i){
 var e=$(id);
 e.addEventListener('pointerdown',function(ev){ e.setPointerCapture(ev.pointerId); ev.preventDefault(); });
 e.addEventListener('pointermove',function(ev){
  if(!e.hasPointerCapture(ev.pointerId)) return;
  var v=pct(ev);
  if(i===0) X1=Math.min(v,X2); else X2=Math.max(v,X1);
  paint(); mark(-1);
 });
 e.addEventListener('keydown',function(ev){
  var d={ArrowLeft:-1,ArrowRight:1,PageDown:-10,PageUp:10}[ev.key];
  if(d===undefined) return;
  ev.preventDefault();
  if(i===0) X1=Math.max(0,Math.min(X2,X1+d)); else X2=Math.max(X1,Math.min(100,X2+d));
  paint(); mark(-1);
 });
});

function rgb(v){ return 'rgb('+v.map(Math.round).join(',')+')' }
function hex(v){ return '#'+v.map(function(x){
 return ('0'+Math.max(0,Math.min(255,Math.round(x))).toString(16)).slice(-2)}).join('').toUpperCase() }

function wedge(ri,ro,a0,a1){
 var f=Math.PI/180, X=function(r,a){return 200+r*Math.cos(a*f)}, Y=function(r,a){return 200+r*Math.sin(a*f)};
 return 'M'+X(ro,a0)+','+Y(ro,a0)+'A'+ro+','+ro+' 0 0 1 '+X(ro,a1)+','+Y(ro,a1)+
        'L'+X(ri,a1)+','+Y(ri,a1)+'A'+ri+','+ri+' 0 0 0 '+X(ri,a0)+','+Y(ri,a0)+'Z';
}
function drawWheel(){
 var R=196, step=360/W.ns, o='<defs><pattern id="h" width="5" height="5" patternTransform="rotate(45)" '+
  'patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width="1.4" stroke-opacity=".45"/></pattern></defs>';
 W.cells.forEach(function(c,i){
  var ri=R*c.r/W.nr, ro=R*(c.r+1)/W.nr;
  o+='<path class="cell" d="'+wedge(ri,ro,c.k*step,(c.k+1)*step)+'" fill="'+rgb(c.rgb)+
     '" stroke="var(--surface)" stroke-width=".5" data-i="'+i+'"></path>';
 });
 W.cells.forEach(function(c){
  if(c.ok) return;
  var ri=R*c.r/W.nr, ro=R*(c.r+1)/W.nr;
  o+='<path d="'+wedge(ri,ro,c.k*step,(c.k+1)*step)+'" fill="url(#h)" pointer-events="none"/>';
 });
 $('wheel').innerHTML=o;
 var rim=W.cells.filter(function(c){return c.r===W.nr-1}).sort(function(a,b){return a.k-b.k});
 if(rim.length) document.documentElement.style.setProperty('--ring',
  rim.concat(rim[0]).map(function(c){return rgb(c.rgb)}).join(','));
}
$('wheel').addEventListener('click',function(e){
 var p=e.target.closest('path.cell'); if(!p||!W) return;
 var i=+p.dataset.i, c=W.cells[i]; load(c.u,c.s,i);
});

var go=$('go');
go.addEventListener('pointermove',function(e){
 var r=go.getBoundingClientRect();
 go.style.setProperty('--mx',(e.clientX-r.left)+'px'); go.style.setProperty('--my',(e.clientY-r.top)+'px');
});

function setBusy(on,what){
 busy=on; go.disabled=on; $('blank').disabled=on;
 $('recipe').classList.toggle('running',on);
 $('st').className='chip'+(on?' busy':''); $('st').textContent=on?(what||'running'):'ready';
 $('golabel').textContent=on?(what==='rinsing'?'Rinsing\u2026':'Mixing\u2026'):'Make color';
 paintBottles();
}
function show(v,settling){
 $('patch').style.backgroundColor=rgb(v);
 $('rgbv').textContent=v.map(function(x){return Math.round(x)}).join('  ');
 $('hexv').innerHTML=hex(v)+(settling?'<em>settling</em>':'');
 mixColour(rgb(v));
}

async function post(path,body){
 sent=path==='/blank'?[0,0,0,S.q_run]:flows(parts(),strength());
 setBusy(true, path==='/blank'?'rinsing':'making color'); $('err').textContent='';
 try{
  var out=await (await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
                                   body:JSON.stringify(body||{})})).json();
  if(out.error){ $('err').textContent=out.error; setBusy(false); $('st').className='chip bad'; $('st').textContent='error'; }
  else { show(out.disp); setBusy(false); }
 }catch(e){ $('err').textContent=String(e); setBusy(false); }
 await sync();
}
go.addEventListener('click',function(){
 var u=parts(); post('/dispense',{a:u[0],b:u[1],c:u[2],strength:strength()});
});
$('blank').addEventListener('click',function(){ post('/blank') });

async function sync(){
 try{
  var s=await (await fetch('/state')).json();
  S=s; drawOverlay(s);
  if(s.live) show(s.live,true);
  else if(s.history.length) show(s.history[s.history.length-1].disp);
  if(s.tripped){ $('st').className='chip bad'; $('st').textContent='tripped'; $('err').textContent=s.error; }
 }catch(e){}
 paint();
}

function drawOverlay(s){
 var o=$('ov');
 if(!s.frame||!s.outline||!s.outline.length){ o.innerHTML=''; return; }
 o.setAttribute('viewBox','0 0 '+s.frame[0]+' '+s.frame[1]);
 o.innerHTML=s.outline.map(function(poly){
  return '<polygon points="'+poly.map(function(p){return p[0]+','+p[1]}).join(' ')+'"/>';
 }).join('');
}
var root=document.documentElement;
function isDark(){ return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches }
$('theme').addEventListener('click',function(){
 var t=isDark()?'light':'dark'; root.dataset.theme=t;
 try{ localStorage.setItem('mixer-theme',t) }catch(e){}
});

var img=$('cam');
function stream(){ img.src='/stream?n='+Date.now(); }
function live(on){ $('live').classList.toggle('down',!on); $('live').lastChild.textContent=on?'Live':'No signal'; }
img.addEventListener('load',function(){ live(true) });
img.addEventListener('error',function(){ live(false); setTimeout(stream,1500); });
stream();

drawBottles(); paint();
new ResizeObserver(function(){ drawBottles(); paintBottles(); }).observe($('bottles'));
fetch('/wheel').then(function(r){return r.json()}).then(function(d){ W=d; drawWheel(); }).catch(function(){});
sync(); setInterval(sync, 600);
})();
</script>
