<!doctype html>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COAST PCL Color Target</title>
<style>
/* Chrome both demos wear: tokens, dark mode, header, settings panel,
   chips, cards, buttons, the wheel's cells, the camera feed. */
:root{
 --bg:#dceaf7;--surface:#fff;--rule:#dce3ea;--ink:#0b2540;--ink2:#435568;--muted:#738396;
 --navy:#003660;--blue:#2774ae;--gold:#f7b629;--glass:#f6f9fc;--bad:#c42b3f;--good:#1a8f4c;
 --ring:#ff4d5e,#ffa31a,#ffe03a,#3fd07f,#27b6f0,#5b6bff,#d44fd6,#ff4d5e;
 --sans:"Avenir Next","Montserrat","Segoe UI",system-ui,-apple-system,sans-serif;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
 font-size:clamp(15px,1.85vmin,24px)}
:root[data-theme=dark]{
 --bg:#0a1521;--surface:#112233;--rule:#223a50;--ink:#eef3f8;--ink2:#b1c0ce;--muted:#8093a6;
 --navy:#1d4a78;--glass:#1a2e42;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0a1521;--surface:#112233;--rule:#223a50;--ink:#eef3f8;--ink2:#b1c0ce;--muted:#8093a6;
 --navy:#1d4a78;--glass:#1a2e42;color-scheme:dark}}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.35 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);gap:1rem;padding:1rem 1.2rem 1.2rem}
header{display:flex;align-items:center;gap:1rem}
header .logo{height:3.4rem;width:auto;display:block}
header .logo.d,:root[data-theme=dark] header .logo.l{display:none}
:root[data-theme=dark] header .logo.d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) header .logo.l{display:none}:root:not([data-theme=light]) header .logo.d{display:block}}
.theme{padding:0;width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.theme:hover{color:var(--ink);background:var(--surface)}
.theme:focus-visible{outline:3px solid var(--blue)}
.theme svg{width:1.25rem;height:1.25rem}
.gear{position:relative}
.panel{position:absolute;right:0;top:110%;z-index:20;min-width:15rem;padding:.9rem 1rem;
 background:var(--surface);border:1px solid var(--rule);border-radius:.9rem;
 box-shadow:0 12px 32px rgba(0,0,0,.18);display:grid;gap:.75rem}
.panel[hidden]{display:none}
.panel h3{margin:0;font:700 .8rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.panel label{display:flex;align-items:center;gap:.8rem;font:600 1rem/1.2 var(--sans);color:var(--ink2);cursor:pointer}
.panel label span{flex:1}
.panel select{font:600 .95rem var(--sans);padding:.35em .5em;border-radius:.5rem;
 border:1.5px solid var(--rule);background:var(--surface);color:var(--ink)}
.panel input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--blue);margin:0}
.feed .turn.flip{transform:rotate(180deg)}
h1{font-size:2.3rem;font-weight:700;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1 span{color:var(--blue)}
header .grow{flex:1}
.chip.busy{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.col{display:flex;flex-direction:column;gap:1rem;min-height:0}

.pick{flex:1}
path.cell{cursor:pointer;transition:stroke-width .12s}
path.cell:hover{stroke:var(--ink);stroke-width:2}
path.on{stroke:var(--ink);stroke-width:3.5}
.go .make{flex:1 1 100%}
.go button:not(.make){flex:1}
button{font:700 1.3rem/1 var(--sans);padding:1rem 1.4rem;border-radius:1rem;border:2px solid var(--rule);
 background:var(--surface);color:var(--ink);cursor:pointer}
.make::before,.make::after{content:"";position:absolute;inset:-5px;border-radius:1.3rem;z-index:-2;
 background:conic-gradient(from var(--spin),var(--ring));animation:spin 5s linear infinite}
.make::after{z-index:-3;filter:blur(14px);opacity:.35;transition:opacity .2s}
.make span{position:relative;z-index:1}
.make b{position:absolute;inset:0;border-radius:1rem;z-index:-1;background:var(--navy)}
.make:hover:not(:disabled){transform:translateY(-2px)}
.make:hover:not(:disabled)::before,.make:hover:not(:disabled)::after{animation-duration:1.6s}
.make:hover:not(:disabled)::after{opacity:.75}
.make:active:not(:disabled){transform:translateY(1px)}
.make:disabled::before,.make:disabled::after{animation-duration:.7s}
.make:disabled::after{opacity:.9}
@keyframes spin{to{--spin:360deg}}
.feed .turn{position:absolute;inset:0;transition:transform .2s}
@keyframes pulse{70%{box-shadow:0 0 0 .5rem rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.feed img,.feed canvas{position:absolute;display:block;max-width:none}
.feed{position:relative;min-height:0;border-radius:.7rem;overflow:hidden;background:#000}
.feed svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.feed svg.ov[hidden]{display:none}
.feed svg.ov polygon{fill:rgba(255,255,255,.10);stroke:rgba(255,255,255,.7);
 stroke-width:1.5;vector-effect:non-scaling-stroke}
.live{position:absolute;top:.7rem;left:.7rem;display:flex;align-items:center;gap:.45em;
 padding:.4em .75em;border-radius:.5rem;background:rgba(0,0,0,.58);color:#fff;
 font:700 .85rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
.live[hidden]{display:none}
.live i{width:.6rem;height:.6rem;border-radius:50%;background:#ff3b3b;
 box-shadow:0 0 0 0 rgba(255,59,59,.7);animation:pulse 1.6s ease-out infinite}
.live.down i{background:#9aa5b1;animation:none}
/* target beside measured, split down the middle */
.pair{min-height:0;display:flex;border-radius:.8rem;overflow:hidden;border:1px solid var(--rule)}
.pair .half{flex:1;position:relative;min-width:0;background:var(--bg);transition:background-color .35s}
.pair .seam{width:9px;background:var(--surface);flex:none}
/* the label stacks over the hex, so the chip never outgrows a narrow half */
.tag{position:absolute;bottom:.7rem;left:.7rem;max-width:calc(100% - 1.4rem);
 display:grid;gap:.25em;justify-items:start;padding:.45em .6em;border-radius:.5rem;
 background:rgba(255,255,255,.85);color:#0b2540}
.tag em{font:700 .72rem/1 var(--sans);font-style:normal;letter-spacing:.14em;
 text-transform:uppercase;opacity:.75}
.tag b{font:700 clamp(.95rem,1.45vmin,1.5rem)/1 var(--mono)}
:root[data-theme=dark] .tag{background:rgba(10,21,33,.75);color:#eef3f8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{background:rgba(10,21,33,.75);color:#eef3f8}}
/* progress, as a fill clipped to the button's own shape */
.make em{position:absolute;inset:0;z-index:-1;border-radius:1rem;overflow:hidden;
 opacity:0;transition:opacity .25s}
.make.busy em{opacity:1}
.make u{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue);
 transition:width .15s linear}
</style>
<style>
.chip{font:700 .95rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
 padding:.6em 1em;border:2px solid var(--rule);border-radius:99px;color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good);color:#fff;border-color:var(--good)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:1rem;min-height:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:1rem;padding:1rem 1.2rem 1.2rem;
 display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--gold))}
h2{font:700 1.25rem/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
 margin:.2rem 0 .9rem;display:flex;align-items:center;gap:1rem;flex:none}
#wheel{flex:1;min-height:0;width:100%;display:block}

.prog{flex:1.05}
.plot{flex:1;min-height:0;width:100%;display:block}
.plot text{font:600 1.05rem var(--sans);fill:var(--muted)}
.plot text.ax{font:700 1rem var(--sans);letter-spacing:.02em;fill:var(--muted)}
.plot text.val{font:700 1.15rem var(--mono);fill:var(--ink)}

.match{flex:1.7}
.pair{flex:1}
.said{margin-top:.7rem;flex:none;min-height:1.3em;text-align:right;
 font:700 1.05rem/1.3 var(--sans);color:var(--muted)}
.said.hit{color:var(--good)}
.said.bad{color:var(--bad)}

.feed{flex:1.15;margin-bottom:.9rem}

.go{display:flex;flex-wrap:wrap;gap:1rem;align-items:stretch;flex:none;padding:1.1rem 6px 6px;margin-top:auto}
/* offline the rinse button is gone, so two buttons share one row */
.go:has(button[hidden]) .make{flex:1 1 55%}
.go button[hidden]{display:none}
button:disabled{cursor:default;opacity:.45}
.make{flex:1;white-space:nowrap;position:relative;isolation:isolate;border:0;color:#fff;font-size:1.7rem;
 background:transparent;transition:transform .15s}

@media (max-width:900px),(max-aspect-ratio:1/1){
 body{overflow:auto}.app{height:auto}
 main{grid-template-columns:1fr}
 #wheel{height:auto;aspect-ratio:1}
 .pair{height:9rem;flex:none}.plot{height:14rem;flex:none}.feed{height:11rem;flex:none}
 .col .card{flex:none}
}
</style>
<script>try{var t=localStorage.getItem('mixer-theme')||'light';if(t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>

   <h2>Pick a color</h2>
   <svg id="wheel" viewBox="0 0 520 520" role="img" aria-label="the color wheel"></svg>
   <div class="go">
    <button class="make" id="go"><b></b><em><u id="fill"></u></em><i></i><span id="golabel">Match color</span></button>
    <button id="blank">Rinse</button>
    <button id="stop">Stop</button>
   </div>
  </div>
 </section>

 <section class="col">
  <div class="card prog">
   <h2>Optimization path</h2>
   <svg class="plot" id="plot" viewBox="0 0 520 260" role="img" aria-label="color deviation per sample"></svg>
  </div>

  <div class="card match">
   <h2>Target vs. measured</h2>
   <div class="feed" id="feed"><div class="turn" id="turn"><img id="cam" alt="the tube">
     <svg class="ov" id="ov" preserveAspectRatio="xMidYMid slice"></svg></div>
    <span class="live" id="live"><i></i><span>Live</span></span></div>
   <div class="pair">
    <div class="half" id="halfT"><span class="tag"><em>Target</em><b id="hexT">&mdash;</b></span></div>
    <div class="seam"></div>
    <div class="half" id="halfM"><span class="tag"><em>Measured</em><b id="hexM">&mdash;</b></span></div>
   </div>
    <div class="said" id="dev"><span id="verdict"></span></div>
  </div>
 </section>
</main>
</div>
<script>
/* The pieces both demos share that are not the wheel or the tube: colour
   conversion, the settings panel, and the progress that fills the Make/Match
   button while the rig works. */
window.Coast = (function () {
var M_INV = [[3.2406, -1.5372, -0.4986], [-0.9689, 1.8758, 0.0415], [0.0557, -0.2040, 1.0570]];
var WP = [0.9505, 1.0, 1.0890];

function lab2rgb(L, a, b) {
 var fy = (L + 16) / 116, fx = fy + a / 500, fz = fy - b / 200, d = 6 / 29;
 var f = function (t) { return t > d ? t * t * t : 3 * d * d * (t - 4 / 29) };
 var xyz = [f(fx) * WP[0], f(fy) * WP[1], f(fz) * WP[2]];
 return M_INV.map(function (r) {
  var v = r[0] * xyz[0] + r[1] * xyz[1] + r[2] * xyz[2];
  v = v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(Math.max(v, 0), 1 / 2.4) - 0.055;
  return Math.round(Math.min(1, Math.max(0, v)) * 255);
 });
}
function rgb(v) { return 'rgb(' + v.map(Math.round).join(',') + ')' }
function hex(v) {
 return '#' + v.map(function (x) {
  return Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0');
 }).join('').toUpperCase();
}

/* ---- the settings panel behind the gear ---- */
function panel(button, box) {
 var open = function (on) { box.hidden = !on; button.setAttribute('aria-expanded', String(on)) };
 button.addEventListener('click', function (e) { e.stopPropagation(); open(box.hidden) });
 document.addEventListener('click', function (e) {
  if (!box.hidden && !e.target.closest('.gear')) open(false);
 });
 addEventListener('keydown', function (e) { if (e.key === 'Escape') open(false) });
 return open;
}
function theme(value) {
 var root = document.documentElement;
 if (value === 'auto') delete root.dataset.theme; else root.dataset.theme = value;
 try { value === 'auto' ? localStorage.removeItem('mixer-theme')
                        : localStorage.setItem('mixer-theme', value) } catch (e) {}
}
function savedTheme() {
 /* light by default: these run on projectors and in bright rooms, and a page
    that guesses dark from the machine's setting is the wrong guess there */
 try { return localStorage.getItem('mixer-theme') || 'light' } catch (e) { return 'light' }
}

/* ---- progress, as a fill across the button that was pressed ----
   The rig reports a step and how long it has been going, on its own cadence; the
   page runs the seconds in between so the fill moves instead of stepping. */
function progress(button, fill, label, idle) {
 var at = { on: false }, WORD = { dispensing: 'Mixing', measuring: 'Measuring' };
 var titled = function (w) {
  return w ? (WORD[w] || w[0].toUpperCase() + w.slice(1)) + '…' : idle;
 };
 setInterval(function () {
  if (!at.on) return;
  var d = Math.min(at.total, at.done + (performance.now() - at.t0) / 1000);
  fill.style.width = (100 * d / at.total).toFixed(1) + '%';
  label.textContent = titled(at.step) + '  ' + Math.max(0, Math.ceil(at.total - d)) + 's';
 }, 100);
 return function (step, secs, done) {
  var on = !!step, total = secs || 1;
  at = { on: on, t0: performance.now(), done: Math.max(0, Math.min(done || 0, total)),
         total: total, step: step };
  button.classList.toggle('busy', on);
  if (!on) { fill.style.width = '0'; label.textContent = idle }
  return on;
 };
}

return { lab2rgb: lab2rgb, rgb: rgb, hex: hex,
         panel: panel, theme: theme, savedTheme: savedTheme, progress: progress };
})();
</script>
<script>
/* The colour wheel both demos pick from. One implementation, so "the wheels are
   the same" is true by construction rather than by eye.

   Only the outer ring can be made on demand: the inner rings are the same hues at
   lower strength, shown in grey so the reachable rim reads as the edge of what the
   rig will mix, and left unclickable so nobody picks one. */
window.Wheel = (function () {
var CX = 260, CY = 260, R0 = 44, R1 = 250, GAP = 1.4;

function polar(deg, r) {
 var a = deg * Math.PI / 180;
 return [CX + Math.cos(a) * r, CY - Math.sin(a) * r];
}
function wedge(h0, dh, ra, rb) {
 var p1 = polar(h0 - dh / 2, ra), p2 = polar(h0 + dh / 2, ra);
 var p3 = polar(h0 + dh / 2, rb), p4 = polar(h0 - dh / 2, rb);
 return 'M' + p1[0] + ' ' + p1[1] + 'A' + ra + ' ' + ra + ' 0 0 0 ' + p2[0] + ' ' + p2[1] +
        'L' + p3[0] + ' ' + p3[1] + 'A' + rb + ' ' + rb + ' 0 0 1 ' + p4[0] + ' ' + p4[1] + 'Z';
}
function rgb(v) { return 'rgb(' + v.map(Math.round).join(',') + ')' }
function grey(v) {
 /* no hue, and compressed into a mid band: these cells read as grey and still
    show their structure instead of washing out to near white */
 var y = (0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]) / 255;
 var g = Math.round(148 + 70 * y);
 return 'rgb(' + g + ',' + g + ',' + g + ')';
}

/* `cells` is the wheel's own list; each needs hue, ring and rgb.
   `opts.grey` greys the inner rings and takes them out of play. The mixer wants
   that -- its strength slider reaches those colours anyway, so the rim is the
   only thing worth clicking. The target has no slider: there the wheel is the
   whole choice, so every ring stays live. */
function draw(svg, cells, opts) {
 var greyInner = !opts || opts.grey !== false;
 var NR = 0, hues = {};
 cells.forEach(function (c) { NR = Math.max(NR, c.ring); hues[c.ring === 1 ? c.hue : c.hue] = 1 });
 var NH = Object.keys(hues).length, o = '';
 cells.forEach(function (c, i) {
  var ra = R0 + (c.ring - 1) * (R1 - R0) / NR + GAP, rb = R0 + c.ring * (R1 - R0) / NR - GAP;
  var rim = c.ring === NR, off = greyInner && !rim;
  o += '<path class="cell' + (off ? ' off' : '') + '" d="' + wedge(c.hue, 360 / NH - GAP, ra, rb) +
       '" fill="' + (off ? grey(c.rgb) : rgb(c.rgb)) +
       '" stroke="var(--rule)" stroke-width=".6" data-i="' + i + '"></path>';
 });
 o += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R1 - 0.7) +
      '" fill="none" stroke="var(--ink)" stroke-width="3.5"/>';
 o += '<circle cx="' + CX + '" cy="' + CY + '" r="' + (R0 - 4) +
      '" fill="var(--surface)" stroke="var(--rule)"/>';
 o += '<circle id="hub" cx="' + CX + '" cy="' + CY + '" r="' + (R0 - 12) + '" fill="none"/>';
 svg.innerHTML = o;
 return NR;
}

/* The selected cell is moved to the end so its neighbours cannot paint over half
   its outline. That reorders the DOM for good, so the cell is found by data-i and
   never by position -- indexing the node list would drift by one per selection. */
function mark(svg, cells, i) {
 var ps = svg.querySelectorAll('path.cell'), hub = svg.querySelector('#hub'), on = null;
 for (var j = 0; j < ps.length; j++) {
  var is = +ps[j].dataset.i === i;
  ps[j].classList.toggle('on', is);
  if (is) on = ps[j];
 }
 if (on) svg.insertBefore(on, svg.querySelector('circle'));
 if (hub) hub.setAttribute('fill', cells && cells[i] ? rgb(cells[i].rgb) : 'none');
}

/* The rim's colours, as a conic gradient for the Make/Match button's ring. */
function ringCss(cells) {
 var NR = Math.max.apply(null, cells.map(function (c) { return c.ring }));
 var rim = cells.filter(function (c) { return c.ring === NR })
                .sort(function (a, b) { return a.hue - b.hue });
 return rim.length ? rim.concat(rim[0]).map(function (c) { return rgb(c.rgb) }).join(',') : null;
}

return { draw: draw, mark: mark, ringCss: ringCss, rgb: rgb, grey: grey,
         CX: CX, CY: CY, R0: R0, R1: R1 };
})();
</script>
<script>
/* The tube as the camera sees it, drawn for the pages that have no camera.
   Both offline demos mount this, so the tube looks the same in each. */
window.Tube = (function () {
var TOP = 242, FPS = 30;
var WHITE = [170.742, 186.915, 181.804], FIELD = [172.212, 194.646, 192.399], WALL = [145, 159, 155];
var FRAME = [640, 480];
var OUTLINE = [[[0,223],[0,245],[105,262],[184,272],[288,282],[405,289],[500,292],[639,292],[639,270],[457,270],[292,262],[161,249]]];
var CENTRE = [[0,234.0],[40,240.5],[80,247.5],[120,253.0],[160,258.5],[200,263.0],[240,267.0],[280,271.0],[320,274.0],[360,276.0],[400,278.0],[440,279.5],[480,280.5],[520,281.5],[560,281.5],[600,281.0],[639,281.0]];

function light(v){ var c=v/255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4) }
function codes(l){ l=Math.max(0,l); return 255*(l<=0.04045/12.92?l*12.92:1.055*Math.pow(l,1/2.4)-0.055) }
function clamp(v){ return Math.max(0,Math.min(255,v)) }
function gauss(){ return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random()) }


var gain = [0,1,2].map(function(i){ return light(TOP)/light(WHITE[i]) });
function balanced(v){ return 'rgb('+shift(v).map(Math.round).join(',')+')' }
function shift(v){ return v.map(function(x,i){ return clamp(codes(light(x)*gain[i])) }) }
var BASE = shift(FIELD);
var grain = [0,1,2,3].map(function () {
 var c=document.createElement('canvas'); c.width=320; c.height=240;
 var x=c.getContext('2d'), d=x.createImageData(320,240);
 for (var i=0;i<d.data.length;i+=4){ var v=128+40*gauss(); d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255 }
 x.putImageData(d,0,0); return c;
});

/* --- where the new fluid has got to, from the flow rather than drawn by eye ---
   Laminar flow drives a parabolic tongue of fresh fluid down the middle of the
   bore, so the leading edge arrives at half the mean volume and a sheath of the
   old fluid clings to the wall behind it. The coiled tube stirs across the bore
   on the way; MIX is how far that has got by the camera. The rig's own campaign
   repeats to 2 dE, which an unstirred tongue cannot do -- it would leave 13 dE
   of the old colour in view at the read. Devon sees colour inside a second, which
   puts the tee about 0.25 mL upstream; at that distance MIX = 0.5 still clears the
   2 dE bar, and the slow wall layer sits in the tube longest so it mixes away
   faster than one fixed MIX allows. The tee behaves as a small stirred volume
   too, so what enters the tube walks from the old colour to the new rather than
   stepping. Explorer: "Claude outputs/tube-front-models.html". */
/* V_VIEW is the tube the camera actually frames -- a close-up of a few cm, not
   the 0.30 mL first guessed, which made everything crawl. At 8 mL/min the fluid
   crosses this window in V_VIEW/Q, so 0.05 mL is about a third of a second. */
var V_DEAD = 0.15, V_VIEW = 0.07, SPREAD = 0.05, MIX = 0.5, V_MIX = 0.12, ROWS = 26;
/* Striations, not slugs. The tee hands over lamellae of the separate dyes and
   almost nothing stirs them back together, so they run as fine lines ALONG the
   flow rather than bands across it. Fluid at the wall crawls while fluid at the
   centre races, so neighbouring lines shear past each other and break up over
   about L_BREAK of travel. It scales absorbance, so it vanishes in clear
   solvent. A pale mix shows them most: there the dye pumps sit near their floor
   and the tee is being asked for a hundredfold dilution, which it does
   relatively worse -- so LIFT raises the amplitude as the fluid gets lighter.
   The pumps stopping does not freeze the pattern; the lines are fine enough
   that diffusion erases them in RELAX_S, far quicker than the ~500 s the full
   bore would take. Nothing on the rig measures any of these. */
var L_BREAK = 0.005, GRAIN = 0.22, LIFT = 0.45, RELAX_S = 15;

function erfc(z) {
 var s = z < 0 ? -1 : 1, x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x);
 var y = ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
   - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
 return 1 - s * (1 - y);
}

/* u runs 0 to 1 across the camera's window; v is the mL pushed since the change.
   `flat` is the share of the bore carrying the new colour evenly, `tip` the share
   inside the tongue of radius `core`, and `f` what the camera averages over. */
function front(u, v) {
 var x = V_DEAD + u * V_VIEW, w = Math.max(0, Math.min(1, 1 - x / (2 * Math.max(v, 1e-9))));
 /* fluid this far along left the tee that much earlier, when the blend was younger */
 var since = function (d) { return 1 - Math.exp(-Math.max(0, v - d) / V_MIX) };
 var flat = MIX * erfc((x - v) / (SPREAD * Math.sqrt(x))) / 2 * since(x);
 var tip = (1 - MIX) * since(x / 2);   /* the tongue runs at twice the mean speed */
 return { flat: flat, core: Math.sqrt(w), tip: tip, x: x, f: flat + tip * w };
}

/* How much richer or leaner this line of sight is than the average. y picks the
   streak, and each depth carries its own material coordinate, so the lines slide
   over one another instead of marching in step. */
function streak(x, y, v, amp) {
 var rush = 2 * (1 - y * y) + 0.08;          /* parabolic, never quite stopped */
 var m = (v - x / rush) / L_BREAK;
 var a = Math.sin(5.6 * y + 1.00 * m + 0.7);
 var b = Math.sin(3.1 * y - 0.62 * m + 2.3);
 var c = Math.sin(1.7 * y + 0.27 * m + 4.1);
 return 1 + amp * (0.50 * a + 0.34 * b * (0.6 + 0.4 * c) + 0.22 * c);
}

/* Looking across a round bore at height y the light travels a chord, not a
   constant depth, so the middle of the tube is always the deepest colour. The
   camera's own reading is the average chord, PI/2 of the radius. */
var MEAN = Math.PI / 2;
/* how hard each channel is absorbed, per unit of path -- fixed for a whole frame,
   along with how strongly this fluid shows its striations */
function depth(old, neu) {
 var k = [0,1,2].map(function (i) {
  return [Math.log(Math.max(neu[i], 1) / BASE[i]) / MEAN,
          Math.log(Math.max(old[i], 1) / BASE[i]) / MEAN];
 });
 var dark = -(k[0][0] + k[1][0] + k[2][0]) / 3 * MEAN;
 return { k: k, amp: GRAIN * Math.min(2.2, LIFT / (Math.max(0, dark) + 0.20)) };
}
function bore(k, m, y, tex) {
 var chord = 2 * Math.sqrt(Math.max(0, 1 - y * y));
 var fresh = Math.min(chord, m.flat * chord
   + m.tip * 2 * Math.sqrt(Math.max(0, m.core * m.core - y * y)));
 var o = k.map(function (c, i) {
  return Math.round(clamp(BASE[i] * Math.exp(tex * (c[0] * fresh + c[1] * (chord - fresh)))));
 });
 return 'rgb(' + o.join(',') + ')';
}

/* `frame()` gives the tube head to tail and whether it is moving: either
   `steps` of ready colours, or `mix` from front() with the two colours to blend */
function paint(el, frame) {
 var cv=document.createElement('canvas');
 cv.id=el.id; cv.width=FRAME[0]; cv.height=FRAME[1];
 cv.style.cssText='position:absolute;display:block';
 el.replaceWith(cv);
 var g=cv.getContext('2d'), last=0, k=0, seen=-1, stopped=0;
 function centre(dy){ g.beginPath(); CENTRE.forEach(function(p,i){ g[i?'lineTo':'moveTo'](p[0],p[1]+dy) }) }
 function band(stops, dy, w) {
  var lg=g.createLinearGradient(0,0,FRAME[0],0);
  stops.forEach(function(c,i){ lg.addColorStop(stops.length>1?i/(stops.length-1):0,c) });
  centre(dy); g.strokeStyle=lg; g.lineWidth=w; g.stroke();
 }
 function draw(ts) {
  requestAnimationFrame(draw);
  if (ts-last < 1000/FPS) return; last=ts;
  var f=frame()||{};
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.fillStyle=balanced(FIELD); g.fillRect(0,0,FRAME[0],FRAME[1]);
  var vg=g.createRadialGradient(320,240,120,320,240,420);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.12)');
  g.fillStyle=vg; g.fillRect(0,0,FRAME[0],FRAME[1]);
  g.lineJoin=g.lineCap='round';
  centre(0); g.strokeStyle=balanced(WALL); g.lineWidth=44; g.stroke();
  if (f.mix && f.mix.length) {
   /* one thin stroke per slice of the bore, so the tongue and the wall sheath show */
   var dye=depth(f.old||BASE, f.neu||BASE), v=f.v||0;
   /* the fluid coasting to a halt is the sim's business; once it is truly still
      the lines relax away instead of freezing on screen */
   /* the coast decays exponentially, so v never settles exactly -- still means
      moving by less than a frame's worth of flow, not byte-identical */
   if (Math.abs(v-seen) > 1e-4) { seen=v; stopped=ts }
   var amp=dye.amp*Math.exp(-(ts-stopped)/1000/RELAX_S);
   for (var r=0; r<ROWS; r++) {
    /* the slice sits across the full band but reads the bore a little inside it,
       so the outermost slice is not a near-empty chord glowing against the wall */
    var u=-1+2*(r+0.5)/ROWS, y=u*0.9;
    band(f.mix.map(function(m){ return bore(dye.k, m, y, streak(m.x, y, v, amp)) }),
         u*17, 34/ROWS+1.2);
   }
  } else band(f.steps&&f.steps.length?f.steps:[balanced(FIELD)], 0, 34);
  g.globalCompositeOperation='overlay'; g.globalAlpha=f.moving?0.16:0.07;
  g.drawImage(grain[k++%4],0,0,FRAME[0],FRAME[1]);
 }
 requestAnimationFrame(draw);
 return cv;
}

/* The band of the frame worth showing: the tube plus a margin either side. */
function crop(state) {
 var s=state||{}, fw=(s.frame&&s.frame[0])||FRAME[0], fh=(s.frame&&s.frame[1])||FRAME[1];
 var line=s.outline&&s.outline.length?s.outline:OUTLINE, lo=1e9, hi=-1e9;
 line.forEach(function(poly){ poly.forEach(function(q){ lo=Math.min(lo,q[1]); hi=Math.max(hi,q[1]) }) });
 var pad=Math.max(10,(hi-lo)*0.8), y0=Math.max(0,lo-pad);
 return { fw: fw, fh: fh, y0: y0, h: Math.min(fh,hi+pad)-y0 };
}

/* the camera's own view, scaled so the tube fills the card: both pages crop the same way */
function fit(feed, cam, state) {
 var box=feed.getBoundingClientRect();
 if (!box.width || !box.height) return;   /* a half-laid-out box crops to nonsense */
 var c=crop(state), fw=c.fw, fh=c.fh, y0=c.y0, h=c.h;
 var k=Math.max(box.width/fw, box.height/h);
 /* the frame always covers the card: an outline that would slide it off the top
    or bottom gets clamped, so a half-empty card is impossible whatever the mask says */
 var clamp=function(want, span, into){ return Math.min(0, Math.max(into-span, want)) };
 cam.style.width=(fw*k)+'px'; cam.style.height=(fh*k)+'px';
 cam.style.left=clamp((box.width-fw*k)/2, fw*k, box.width)+'px';
 cam.style.top=clamp(box.height/2-(y0+h/2)*k, fh*k, box.height)+'px';
}

/* the card settles after the first paint and grows as the run fills it, so the
   crop follows the box rather than being computed once and hoped over */
function follow(feed, cam, state) {
 var at = state || function () { return null };
 var again = function () { fit(feed, cam, at()) };
 again();
 if (typeof ResizeObserver !== 'undefined') new ResizeObserver(again).observe(feed);
 addEventListener('resize', again);
 return again;
}

/* The mask the rig carved, drawn over the feed in the frame's own coordinates. */
function overlay(ov, state) {
 var s=state||{}, c=crop(s);
 if (!s.outline || !s.outline.length) { ov.innerHTML=''; return }
 ov.setAttribute('viewBox', '0 ' + c.y0 + ' ' + c.fw + ' ' + c.h);
 ov.innerHTML = s.outline.map(function (poly) {
  return '<polygon points="' + poly.map(function (p) { return p[0] + ',' + p[1] }).join(' ') + '"/>';
 }).join('');
}

/* A camera that has stopped sending says so, rather than showing a stale frame. */
function watch(img, badge, onFrame) {
 var seen = 0;
 var mark = function (on) {
  badge.classList.toggle('down', !on);
  badge.lastChild.textContent = on ? 'Live' : 'No signal';
 };
 img.addEventListener('load', function () { seen = Date.now(); mark(true); if (onFrame) onFrame() });
 img.addEventListener('error', function () { mark(false) });
 setInterval(function () { if (seen && Date.now() - seen > 4000) mark(false) }, 1000);
 return mark;
}

return { frame: FRAME, outline: OUTLINE, field: balanced(FIELD), base: BASE, crop: crop, front: front, streak: streak,
         paint: paint, fit: fit, follow: follow, overlay: overlay, watch: watch };

<script>
/* The target demo with no rig behind it. It emits the same events the rig's
   socket sends, so the page cannot tell the difference and neither path gets
   its own special case. */
window.TargetSim = (function () {
function noiseOf(v) { return (Math.random() + Math.random() + Math.random() - 1.5) * v }

function bias(c) {
 /* the rig sits about `expect` dE off what the model says, in a direction that
    holds for the colour, so a chase drifts rather than scattering */
 var r = ((c.hue * 7 + c.ring * 131) % 360) * Math.PI / 180;
 var v = [Math.cos(r) * 0.5, Math.sin(r), Math.cos(r * 1.7)];
 var n = Math.hypot(v[0], v[1], v[2]);
 return v.map(function (x) { return x / n * c.expect });
}

/* The same push and window the mixer uses, worked out the same way, so a sample
   here takes as long as a mix there. */
var Q_RUN = 8, V_PUSH = 2.2, WINDOW_S = 5;
var PUSH_S = Math.max(0, 60 * V_PUSH / Q_RUN - WINDOW_S / 2), READ_S = WINDOW_S;
/* the reading lands, then the chase takes a moment to pick where to go next */
var THINK_S = 3;

async function run(cell, wheel, send, dE) {
 var plan = cell.approach, off = bias(cell);
 var wait = function (s) { return new Promise(function (r) { setTimeout(r, s * 1000) }) };
 var de = null;
 for (var i = 0; i < wheel.tries; i++) {
  var st = plan[Math.min(i, plan.length - 1)];
  var lab = st.lab.map(function (v, k) {
   return v + off[k] + noiseOf(st.noise) * (k ? 0.8 : 0.4);
  });
  /* `coming` is what the page paints travelling down the tube; the rig has no
     equivalent because there the fluid speaks for itself */
  send({ kind: "step", label: "sample " + (i + 1), attempt: i + 1, secs: PUSH_S, coming: lab });
  await wait(PUSH_S);
  send({ kind: "measuring", secs: READ_S });
  await wait(READ_S);
  de = dE(lab, cell.lab);
  send({ kind: "read", attempt: i + 1, lab: lab, de: de });
  if (de <= wheel.stop_de) break;
  de = null;
  if (i + 1 < wheel.tries) { send({ kind: "choosing", secs: THINK_S }); await wait(THINK_S); }
 }
 send({ kind: "done", de: de });
}

return { run: run };
})();
</script>
<script>
const $ = s => document.querySelector(s), SVGNS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, p = null) => { const e = document.createElementNS(SVGNS, n);
  for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const RIG = typeof BAKED === "undefined";
let W = null, cells = [], sel = null, path = [], running = false, sock = null, verdict = null;
let state = {};  // frame and tube outline, as the rig reports them
let refit = () => {};  // re-crops the camera to the tube; set once the page is up
let live = null;       // the colour so far, while the window is still open
let coming = null;     // the colour on its way down the tube
let phase = { what: "", t0: 0, secs: 0 };

/* ---- colour ---- */
const labRGB = (L, a, b) => Coast.rgb(Coast.lab2rgb(L, a, b));
const rgbOf = a => Coast.rgb(a);
const dE = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
const stopAt = () => W ? W.stop_de : 2;

/* ---- the wheel ---- */
function drawWheel() {
  const svg = $("#wheel");
  Wheel.draw(svg, cells, { grey: false });
  const i = cells.findIndex(c => sel && c.hue === sel.hue && c.ring === sel.ring);
  Wheel.mark(svg, cells, i);
  /* only the rim answers a click; the inner rings are context, not choices */
  svg.querySelectorAll("path.cell:not(.off)").forEach(p => {
    p.onclick = () => { if (!running) { sel = cells[+p.dataset.i]; path = []; verdict = null; render(); } };
  });
}

/* ---- target against what is in the tube ---- */
const hexOf = css => Coast.hex((css.match(/\d+/g) || []).map(Number));
function drawPair() {
  /* the last colour actually read stays on show while the next sample is on its
     way, so the half is never blank in the middle of a run */
  const done = path.filter(p => p.lab);
  const cur = live || (done.length ? done[done.length-1].lab : null);
  const t = sel ? labRGB(sel.lab[0], sel.lab[1], sel.lab[2]) : null;
  const m = cur ? labRGB(cur[0], cur[1], cur[2]) : null;
  $("#halfT").style.background = t || css("--glass");
  $("#halfM").style.background = m || css("--glass");
  $("#hexT").textContent = t ? hexOf(t) : "\u2014";
  $("#hexM").textContent = m ? hexOf(m) : "\u2014";
}

/* ---- how close, read by read ---- */
/* Drawn the way the mixer draws its spectrum: a viewBox in real pixels so the
   type keeps its rem size whatever the card does, and the sizes left to CSS. */
function drawPlot() {
  const svg = $("#plot"), box = svg.getBoundingClientRect();
  if (!box.width || !box.height) return;
  const Wd = Math.round(box.width), H = Math.round(box.height);
  const fs = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const L = 3.4 * fs + 14, R = 12, T = 1.4 * fs, B = 3.4 * fs, lo = 0.5, hi = 60;
  const n = Math.max(W ? W.tries : 6, path.length), PAD = 1.1 * fs;
  const X = i => L + PAD + (n > 1 ? i * (Wd - L - R - 2 * PAD) / (n - 1) : (Wd - L - R) / 2 - PAD);
  const span = Math.log10(hi) - Math.log10(lo);
  const Y = v => T + (Math.log10(hi) - Math.log10(Math.min(hi, Math.max(v, lo)))) / span * (H - T - B);
  svg.setAttribute("viewBox", `0 0 ${Wd} ${H}`);
  svg.innerHTML = "";

  for (const t of [1, 2, 5, 10, 20, 50]) {
    const hit = t === stopAt();
    el("line", { x1: L, y1: Y(t), x2: Wd - R, y2: Y(t), stroke: hit ? css("--good") : css("--rule"),
      "stroke-width": hit ? 2 : 1, "stroke-dasharray": hit ? "6 5" : "" }, svg);
    el("text", { x: L - .6 * fs, y: Y(t) + .34 * fs,
      fill: hit ? css("--good") : css("--muted"), "text-anchor": "end" }, svg).textContent = t;
  }
  el("line", { x1: L, y1: H - B, x2: Wd - R, y2: H - B,
    stroke: css("--ink2"), "stroke-width": 1.2 }, svg);
  for (let i = 0; i < n; i++)
    el("text", { x: X(i), y: H - B + 1.5 * fs, "text-anchor": "middle" }, svg).textContent = i + 1;
  el("text", { class: "ax", x: (L + Wd - R) / 2, y: H - .35 * fs, "text-anchor": "middle" }, svg)
    .textContent = "SAMPLE";
  const mid = (T + H - B) / 2, ax = .95 * fs;
  const yax = el("text", { class: "ax yax", x: ax, y: mid, "text-anchor": "middle",
    transform: `rotate(-90 ${ax} ${mid})` }, svg);
  yax.textContent = "COLOR DEVIATION";
  const room = (H - T - B) - .5 * fs;
  if (room > 0 && yax.getComputedTextLength() > room) {
    yax.setAttribute("textLength", room.toFixed(1));
    yax.setAttribute("lengthAdjust", "spacingAndGlyphs");
  }

  const pts = path.filter(p => p.de != null);
  if (pts.length > 1)
    el("path", { d: pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.de).toFixed(1)).join(" "),
      fill: "none", stroke: css("--blue"), "stroke-width": 3, "stroke-linejoin": "round" }, svg);
  /* the dot is the colour that read actually was: the walk and the colours are one picture */
  pts.forEach((p, i) => el("circle", { cx: X(i), cy: Y(p.de), r: .55 * fs,
    fill: p.lab ? labRGB(p.lab[0], p.lab[1], p.lab[2]) : css("--glass"),
    stroke: p.de <= stopAt() ? css("--good") : css("--ink"), "stroke-width": 2.5 }, svg));
  /* only the newest sample carries its number, right where it sits */
  if (pts.length) {
    const i = pts.length - 1, last = pts[i], x = X(i), near = x > Wd - R - 3 * fs;
    /* haloed in the card's own colour, so it stays readable over a gridline */
    el("text", { class: "val", x: near ? x - .9 * fs : x, y: Y(last.de) - 1.15 * fs,
      "text-anchor": near ? "end" : "middle",
      stroke: css("--surface"), "stroke-width": 4, "paint-order": "stroke",
      fill: last.de <= stopAt() ? css("--good") : css("--ink") }, svg)
      .textContent = last.de.toFixed(1);
  }
}

/* the countdown and fill inside the button, shared with the mixer */
const setStep = Coast.progress($("#go"), $("#fill"), $("#golabel"), "Match color");
function began(what, secs) {
  phase = { what, t0: performance.now(), secs: secs || 0 };
  setStep(what, secs, 0);
}
function chip(cls, text) { const c = $("#st"); c.className = "chip" + (cls ? " " + cls : ""); c.textContent = text; }

function render() {
  drawWheel(); drawPair(); drawPlot();
  const last = path.filter(p => p.de != null).pop();
  $("#dev").classList.toggle("hit", !!last && last.de <= stopAt());
  $("#verdict").textContent = verdict || "";
  $("#dev").classList.toggle("bad", $("#st").classList.contains("bad"));
  $("#go").disabled = !sel;
  $("#blank").disabled = running;
  $("#stop").disabled = !running;
}

/* ---- running it ---- */
const STOPS = 64, Q_RUN = 8, RAMP_S = 0.6, STOP_S = 0.9;
let ran = 0, coastFrom = 0;
function pushed() {
  /* mL through the tube since this mix started, which is what sets the front.
     Same ramp up and coast down as the mixer, so the two feeds run alike. */
  if (phase.what === "dispensing" && phase.secs > 0) {
    coastFrom = 0;
    const dt = (performance.now() - phase.t0) / 1000;
    return ran = Q_RUN / 60 * (dt - RAMP_S * (1 - Math.exp(-dt / RAMP_S)));
  }
  /* the line coasts rather than stopping dead, and holds where it lands */
  if (!coastFrom) coastFrom = performance.now();
  const ds = (performance.now() - coastFrom) / 1000;
  return ran + Q_RUN / 60 * STOP_S * (1 - Math.exp(-ds / STOP_S));
}
const labTriple = l => Coast.lab2rgb(l[0], l[1], l[2]);
let inTube = null;     /* what the camera is looking at, carried across runs */
function tubeFrame() {
  const old = inTube || Tube.base;
  const v = pushed(), mix = [];
  for (let i = 0; i <= STOPS; i++) mix.push(Tube.front(i / STOPS, v));
  return { old, neu: coming ? labTriple(coming) : old, mix, v, moving: running };
}
/* Every push starts from what is already in front of the camera, so the feed
   never jumps -- not between samples and not when a new chase begins. Same
   hand-over the mixer does in flow(). */
function handOver() {
  const f = tubeFrame(), t = Tube.front(0.5, f.v).f;
  inTube = f.old.map((x, i) => x + t * (f.neu[i] - x));
}

async function runOffline() {
  running = true; path = []; verdict = null; live = null;
  handOver(); coming = null;   /* the tube keeps what it holds */
  chip("busy", "running"); render();
  await TargetSim.run(sel, W, onEvent, dE);
  running = false; render();
}
async function runRig() {
  running = true; path = []; verdict = null; live = null;
  handOver(); coming = null;   /* the tube keeps what it holds */
  chip("busy", "running"); render();
  await fetch("/chase", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ hue: sel.hue, ring: sel.ring }) });
}
function onEvent(e) {
  if (e.kind === "step") {
    handOver(); if (e.coming) coming = e.coming;
    if (e.attempt) { path.push({ lab: null, de: null }); render(); }
    began(e.label === "water" ? "rinsing" : "dispensing", e.secs);
  } else if (e.kind === "measuring") { live = null; began("measuring", e.secs); }
  else if (e.kind === "choosing") { began("deciding", e.secs); }
  else if (e.kind === "live") { live = e.lab; drawPair(); }
  else if (e.kind === "read") {
    const p = path[path.length-1] || {}; p.lab = e.lab || null; p.de = e.de;
    live = null;
    if (e.striped) chip("bad", "segmented");
    render();
  } else if (e.kind === "done") {
    const n = path.filter(p => p.de != null).length;
    verdict = e.de != null ? `color found in ${n} sample${n === 1 ? "" : "s"}`
                           : `closest of ${n} sample${n === 1 ? "" : "s"}`;
    chip(e.de != null ? "good" : "", e.de != null ? "color found" : "out of samples");
    began("", 0); render();
  } else if (e.kind === "error") {
    /* a stop the operator asked for is not a fault */
    const byHand = /stopped by hand|^Stopped:/i.test(e.why || "");
    verdict = byHand ? "" : e.why;
    chip(byHand ? "" : "bad", byHand ? "stopped" : "failed");
    began("", 0); render();
  } else if (e.kind === "idle") {
    running = false; began("", 0);
    if (!verdict) chip("", "ready");
    render();
  }
}
function connect() {
  sock = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  sock.onmessage = m => { const e = JSON.parse(m.data);
    if (e.kind === "hello") { running = e.busy; state = e; refit(); Tube.overlay($("#ov"), state);
      (e.events || []).forEach(onEvent); render(); }
    else onEvent(e); };
  sock.onclose = () => setTimeout(connect, 1500);
}

/* ---- wiring ---- */
addEventListener("resize", () => drawPlot());
$("#go").onclick = () => { if (!running) (RIG ? runRig() : runOffline()); };
$("#blank").onclick = async () => {
  /* re-measures the tube full of solvent, when the carve's white has drifted */
  running = true; verdict = null; live = null; chip("busy", "rinsing"); render();
  await fetch("/blank", { method: "POST" });
};
$("#stop").onclick = async () => { if (RIG) await fetch("/stop", { method: "POST" });
  running = false; verdict = null; began("", 0); chip("", "stopped"); render(); };

/* ---- settings ---- */
const root = document.documentElement;
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch (e) {} };
const stored = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
Coast.panel($("#theme"), $("#panel"));
$("#opt-theme").onchange = e => { Coast.theme(e.target.value); render(); };
$("#opt-feed").onchange = e => {
  $("#feed").hidden = !e.target.checked; store("chase-feed", e.target.checked ? "1" : "0");
};
$("#opt-turn").onchange = e => {
  $("#turn").classList.toggle("flip", e.target.checked); store("chase-turn", e.target.checked ? "1" : "0");
};
$("#opt-mask").onchange = e => {
  $("#ov").toggleAttribute("hidden", !e.target.checked);   /* svg has no .hidden */ store("chase-mask", e.target.checked ? "1" : "0");
};

(async function start() {
  W = RIG ? await (await fetch("wheel")).json() : BAKED;
  cells = W.cells;
  sel = cells.find(c => c.hue === 300 && c.ring === 4) || cells[0];
  if (RIG) {
    connect(); $("#cam").src = "/stream";
    Tube.watch($("#cam"), $("#live"));
  }
  else Tube.paint($("#cam"), tubeFrame);
  $("#opt-theme").value = Coast.savedTheme();
  $("#opt-feed").checked = stored("chase-feed") !== "0";
  $("#opt-turn").checked = stored("chase-turn") === "1";
  $("#opt-mask").checked = stored("chase-mask") === "1";
  for (const id of ["opt-feed", "opt-turn", "opt-mask"]) $("#" + id).onchange({ target: $("#" + id) });
  refit = Tube.follow($("#feed"), $("#cam"), () => state);
  for (const id of ["opt-turn", "opt-mask"]) $("#" + id).closest("label").hidden = !RIG;
  $("#blank").hidden = !RIG;
  render();
})();
</script>
